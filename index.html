// ── localStorage helpers ───────────────────────────────────────────────────
function ls(key, def) {
  try {
    const v = localStorage.getItem(key);
    return v !== null ? JSON.parse(v) : def;
  } catch { return def; }
}
function save(key, val) {
  localStorage.setItem(key, JSON.stringify(val));
}

// ── 初始化種子資料 ─────────────────────────────────────────────────────────
function initData() {
  if (!localStorage.getItem('ld_inited_v3')) { localStorage.removeItem('ld_inited');
    save('ld_accounts',   DEFAULT_ACCOUNTS);
    save('ld_classrooms', DEFAULT_CLASSROOMS);
    save('ld_slots',      []);
    save('ld_bookings',   []);
    save('ld_records',    []);
    localStorage.setItem('ld_inited_v3', '1');
  }
}

// ── 帳號 ───────────────────────────────────────────────────────────────────
const accountsDB = {
  all:    ()        => ls('ld_accounts', []),
  get:    id        => accountsDB.all().find(a => a.id === id) || null,
  save:   list      => save('ld_accounts', list),
  login:  (u, p)    => accountsDB.all().find(a => a.username === u && a.password === p && a.active) || null,
  add:    account   => { const list = accountsDB.all(); list.push(account); accountsDB.save(list); },
  update: (id, patch) => {
    const list = accountsDB.all().map(a => a.id === id ? { ...a, ...patch } : a);
    accountsDB.save(list);
  },
};

// ── 教室 ───────────────────────────────────────────────────────────────────
const classroomsDB = {
  all:  ()      => ls('ld_classrooms', []),
  get:  id      => classroomsDB.all().find(c => c.id === id) || null,
  save: list    => save('ld_classrooms', list),
  add:  classroom => { const list = classroomsDB.all(); list.push(classroom); classroomsDB.save(list); },
  update: (id, patch) => {
    const list = classroomsDB.all().map(c => c.id === id ? { ...c, ...patch } : c);
    classroomsDB.save(list);
  },
};

// ── 時段 ───────────────────────────────────────────────────────────────────
const slotsDB = {
  all:          ()           => ls('ld_slots', []),
  byClassroom:  cid          => slotsDB.all().filter(s => s.classroomId === cid),
  get:          id           => slotsDB.all().find(s => s.id === id) || null,
  save:         list         => save('ld_slots', list),
  add:          slot         => { const list = slotsDB.all(); list.push(slot); slotsDB.save(list); },
  delete:       id           => { slotsDB.save(slotsDB.all().filter(s => s.id !== id)); },
  update:       (id, patch)  => {
    slotsDB.save(slotsDB.all().map(s => s.id === id ? { ...s, ...patch } : s));
  },
};

// ── 預約 ───────────────────────────────────────────────────────────────────
const bookingsDB = {
  all:         ()  => ls('ld_bookings', []),
  bySlot:      sid => bookingsDB.all().filter(b => b.slotId === sid),
  byClassroom: cid => {
    const slotIds = slotsDB.byClassroom(cid).map(s => s.id);
    return bookingsDB.all().filter(b => slotIds.includes(b.slotId));
  },
  get:    id       => bookingsDB.all().find(b => b.id === id) || null,
  save:   list     => save('ld_bookings', list),
  add:    booking  => {
    const list = bookingsDB.all();
    list.push(booking);
    bookingsDB.save(list);
  },
  cancel: id       => { bookingsDB.save(bookingsDB.all().filter(b => b.id !== id)); },
  update: (id, patch) => {
    bookingsDB.save(bookingsDB.all().map(b => b.id === id ? { ...b, ...patch } : b));
  },
};

// ── 診斷紀錄 ───────────────────────────────────────────────────────────────
const recordsDB = {
  all:          ()  => ls('ld_records', []),
  byBooking:    bid => recordsDB.all().find(r => r.bookingId === bid) || null,
  byClassroom:  cid => {
    const bids = bookingsDB.byClassroom(cid).map(b => b.id);
    return recordsDB.all().filter(r => bids.includes(r.bookingId));
  },
  save:   list      => save('ld_records', list),
  upsert: record    => {
    const list = recordsDB.all().filter(r => r.bookingId !== record.bookingId);
    list.push(record);
    recordsDB.save(list);
  },
};

// ── uid 工廠 ───────────────────────────────────────────────────────────────
function uid(prefix = 'id') {
  return `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;
}

// ── 格式化日期 ────────────────────────────────────────────────────────────
function fmtDate(isoDate) {
  const d = new Date(isoDate + 'T00:00:00');
  const days = ['日','一','二','三','四','五','六'];
  return `${d.getMonth()+1}/${d.getDate()}（週${days[d.getDay()]}）`;
}

function fmtDateTime(isoDate, time) {
  return `${fmtDate(isoDate)} ${time}`;
}

// ── 統計輔助 ───────────────────────────────────────────────────────────────
function statsForClassroom(cid) {
  const slots    = slotsDB.byClassroom(cid);
  const bookings = bookingsDB.byClassroom(cid);
  const records  = recordsDB.byClassroom(cid);
  const total    = bookings.length;
  const done     = bookings.filter(b => b.status === 'done').length;
  const pending  = bookings.filter(b => b.status === 'pending').length;
  const scores   = records.filter(r => r.score != null).map(r => Number(r.score));
  const avgScore = scores.length ? Math.round(scores.reduce((a, b) => a + b, 0) / scores.length) : null;

  // 科目分佈
  const subjectMap = {};
  SUBJECTS.forEach(s => { subjectMap[s] = 0; });
  bookings.forEach(b => {
    const slot = slotsDB.get(b.slotId);
    if (slot) subjectMap[slot.subject] = (subjectMap[slot.subject] || 0) + 1;
  });

  return { total, done, pending, avgScore, subjectMap, slotCount: slots.length };
}

  const doLogin = () => {
    const u = document.querySelector('#login-user').value.trim();
    const p = document.querySelector('#login-pass').value;
    const user = accountsDB.login(u, p);
    if (user) {
      onLogin(user);
    } else {
      document.querySelector('#login-error').classList.remove('hidden');
      document.querySelector('#login-pass').value = '';
      document.querySelector('#login-pass').focus();
    }
  };

  document.querySelector('#btn-login').addEventListener('click', doLogin);
  document.querySelector('#login-pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  document.querySelector('#login-user').addEventListener('keydown', e => { if (e.key === 'Enter') document.querySelector('#login-pass').focus(); });
}



function renderParentPage(container) {
  container.innerHTML = buildParentPage();

}

  const classroomOptions = classrooms.map(c => `<option value="${c.id}">${c.name}</option>`).join('');

let selectedSlotId = null;
let step1Data = {};

function bindParentEvents(container) {
  selectedSlotId = null;
  step1Data = {};

  // Step 1 → Step 2
  container.querySelector('#btn-to-step2').addEventListener('click', () => {
    const name    = container.querySelector('#p-name').value.trim();
    const phone   = container.querySelector('#p-phone').value.trim();
    const gradeId = container.querySelector('#p-grade').value;
    const subject = container.querySelector('#p-subject').value;
    const cid     = container.querySelector('#p-classroom').value;
    const note    = container.querySelector('#p-note').value.trim();
    const errEl   = container.querySelector('#p-step1-error');

    if (!name || !phone) {
      errEl.textContent = '請填寫學生姓名與聯絡電話';
      errEl.classList.remove('hidden');
      return;
    }
    errEl.classList.add('hidden');
    step1Data = { name, phone, gradeId: Number(gradeId), subject, classroomId: cid, note };

    renderSlotPicker(container, cid, subject);
    goToStep(container, 2);
  });

  // Step 2 → Step 1
  container.querySelector('#btn-back-step1').addEventListener('click', () => goToStep(container, 1));

  // Step 2 → Confirm
  container.querySelector('#btn-to-step3').addEventListener('click', () => {
    if (!selectedSlotId) {
      const errEl = container.querySelector('#p-step2-error');
      errEl.textContent = '請選擇一個可用時段';
      errEl.classList.remove('hidden');
      return;
    }
    confirmBooking(container);
  });

  // New booking
  container.querySelector('#btn-new-booking').addEventListener('click', () => {
    selectedSlotId = null;
    step1Data = {};
    container.querySelector('#p-name').value = '';
    container.querySelector('#p-phone').value = '';
    container.querySelector('#p-note').value = '';
    goToStep(container, 1);
  });

  // Query bookings
  container.querySelector('#btn-query').addEventListener('click', () => {
    const phone = container.querySelector('#query-phone').value.trim();
    renderQueryResult(container, phone);
  });
  container.querySelector('#query-phone').addEventListener('keydown', e => {
    if (e.key === 'Enter') container.querySelector('#btn-query').click();
  });
}

function goToStep(container, step) {
  [1, 2, 3].forEach(n => {
    container.querySelector(`#parent-step-${n}`).classList.toggle('hidden', n !== step);
    const dot = container.querySelector(`#step-${n}`);
    dot.classList.remove('active', 'done');
    if (n < step) dot.classList.add('done');
    else if (n === step) dot.classList.add('active');
    if (n < 3) {
      const line = container.querySelector(`#line-${n}`);
      line.classList.toggle('done', n < step);
    }
  });
}

function renderSlotPicker(container, classroomId, subject) {
  selectedSlotId = null;
  const area = container.querySelector('#slot-picker-area');
  const slots = slotsDB.byClassroom(classroomId)
    .filter(s => s.subject === subject)
    .sort((a, b) => a.date.localeCompare(b.date) || a.time.localeCompare(b.time));

  // Group by date
  const byDate = {};
  slots.forEach(s => {
    if (!byDate[s.date]) byDate[s.date] = [];
    byDate[s.date].push(s);
  });

  if (Object.keys(byDate).length === 0) {
    area.innerHTML = `<div class="alert alert-amber">${icon('info','icon')} 目前此教室沒有「${subject}」的開放時段，請聯絡教室或稍後再查詢。</div>`;
    return;
  }

  let html = '';
  Object.keys(byDate).sort().forEach(date => {
    html += `<p class="fw-600 text-zh mb-8 mt-12" style="font-size:.875rem;color:var(--gray-700)">${icon('calendar','icon')} ${fmtDate(date)}</p>`;
    html += `<div class="slot-grid">`;
    byDate[date].forEach(slot => {
      const booked = bookingsDB.bySlot(slot.id).length;
      const remain = slot.capacity - booked;
      const full   = remain <= 0;
      html += `
        <div class="slot-card ${full ? 'full' : ''}" data-slot-id="${slot.id}">
          <div class="slot-time">${slot.time}</div>
          <div class="slot-meta">${full ? '<span class="slot-full-label">已額滿</span>' : `剩 ${remain} 位`}</div>
        </div>`;
    });
    html += `</div>`;
  });
  area.innerHTML = html;

  area.querySelectorAll('.slot-card:not(.full)').forEach(el => {
    el.addEventListener('click', () => {
      area.querySelectorAll('.slot-card').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
      selectedSlotId = el.dataset.slotId;
      container.querySelector('#p-step2-error').classList.add('hidden');
    });
  });
}

function confirmBooking(container) {
  const slot     = slotsDB.get(selectedSlotId);
  const classroom = classroomsDB.get(step1Data.classroomId);
  const grade    = GRADES.find(g => g.id === step1Data.gradeId);
  const booking  = {
    id: uid('bk'),
    slotId: selectedSlotId,
    studentName: step1Data.name,
    phone: step1Data.phone,
    gradeId: step1Data.gradeId,
    subject: step1Data.subject,
    classroomId: step1Data.classroomId,
    note: step1Data.note,
    status: 'pending',
    createdAt: new Date().toISOString(),
  };
  bookingsDB.add(booking);

  container.querySelector('#confirm-summary').textContent =
    `${step1Data.name} 同學的 ${step1Data.subject} 學力診斷`;
  container.querySelector('#confirm-detail').innerHTML = `
    <div>📚 科目：${step1Data.subject}</div>
    <div>🎓 學年：${grade?.label || ''}</div>
    <div>🏫 教室：${classroom?.name || ''}</div>
    <div>📅 日期：${fmtDate(slot.date)}</div>
    <div>⏰ 時間：${slot.time}</div>
    <div>📞 聯絡電話：${step1Data.phone}</div>
    ${step1Data.note ? `<div>📝 備註：${step1Data.note}</div>` : ''}
  `;
  goToStep(container, 3);
}

function renderQueryResult(container, phone) {
  const result = container.querySelector('#query-result');
  if (!phone) { result.innerHTML = `<div class="form-error">請輸入電話號碼</div>`; return; }

  const bookings = bookingsDB.all()
    .filter(b => b.phone === phone)
    .sort((a, b) => b.createdAt.localeCompare(a.createdAt));

  if (bookings.length === 0) {
    result.innerHTML = `<div class="alert alert-amber">${icon('info','icon')} 查無此電話的預約紀錄</div>`;
    return;
  }

  const statusMap = { pending: ['待診斷','badge-amber'], done: ['已完成','badge-green'], cancelled: ['已取消','badge-gray'] };

  let rows = bookings.map(b => {
    const slot = slotsDB.get(b.slotId);
    const cls  = classroomsDB.get(b.classroomId);
    const [label, cls2] = statusMap[b.status] || ['未知','badge-gray'];
    return `<tr>
      <td>${b.studentName}</td>
      <td>${slot ? fmtDate(slot.date) : '-'}</td>
      <td>${slot?.time || '-'}</td>
      <td>${b.subject}</td>
      <td>${cls?.name || '-'}</td>
      <td><span class="badge ${cls2}">${label}</span></td>
    </tr>`;

function bindSlotEvents(container, user) {
  renderSlotsTable(container, user);
  populateDateFilter(container, user);

  container.querySelector('#btn-add-slot').addEventListener('click', () => {
    const date     = container.querySelector('#new-date').value;
    const time     = container.querySelector('#new-time').value;
    const subject  = container.querySelector('#new-subject').value;
    const capacity = Number(container.querySelector('#new-capacity').value);
    const errEl    = container.querySelector('#slot-add-error');

    if (!date) { errEl.textContent = '請選擇日期'; errEl.classList.remove('hidden'); return; }
    errEl.classList.add('hidden');

    // Duplicate check
    const existing = slotsDB.byClassroom(user.classroomId).find(s => s.date === date && s.time === time && s.subject === subject);
    if (existing) { errEl.textContent = '此日期時間與科目已存在相同時段'; errEl.classList.remove('hidden'); return; }

    slotsDB.add({ id: uid('sl'), classroomId: user.classroomId, date, time, subject, capacity, createdAt: new Date().toISOString() });
    renderSlotsTable(container, user);
    populateDateFilter(container, user);
    showToast('時段已新增', 'success');
  });

  container.querySelector('#filter-date').addEventListener('change', () => renderSlotsTable(container, user));
  container.querySelector('#filter-subject').addEventListener('change', () => renderSlotsTable(container, user));
}

function renderSlotsTable(container, user) {
  const tbody      = container.querySelector('#slots-tbody');
  const filterDate = container.querySelector('#filter-date')?.value || '';
  const filterSub  = container.querySelector('#filter-subject')?.value || '';

  let slots = slotsDB.byClassroom(user.classroomId)
    .filter(s => (!filterDate || s.date === filterDate) && (!filterSub || s.subject === filterSub))
    .sort((a, b) => a.date.localeCompare(b.date) || a.time.localeCompare(b.time));

  if (!slots.length) { tbody.innerHTML = `<tr><td colspan="7" class="table-empty">尚無時段，請新增</td></tr>`; return; }

  tbody.innerHTML = slots.map(s => {
    const booked = bookingsDB.bySlot(s.id).length;
    const remain = s.capacity - booked;
    const full   = remain <= 0;
    return `<tr>
      <td>${fmtDate(s.date)}</td>
      <td><span style="font-family:var(--font-body);font-weight:600">${s.time}</span></td>
      <td><span class="badge badge-blue">${s.subject}</span></td>
      <td>${s.capacity}</td>
      <td>${booked}</td>
      <td><span class="badge ${full ? 'badge-red' : 'badge-green'}">${full ? '已額滿' : `剩 ${remain}`}</span></td>
      <td>
        <button class="btn btn-sm btn-danger" data-del="${s.id}" ${booked > 0 ? 'disabled title="已有預約，無法刪除"' : ''}>
          ${icon('trash','icon')} 刪除
        </button>
      </td>
    </tr>`;
  }).join('');

  tbody.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (!confirm('確定要刪除此時段？')) return;
      slotsDB.delete(btn.dataset.del);
      renderSlotsTable(container, user);
      populateDateFilter(container, user);
      showToast('時段已刪除');
    });
  });
}

function populateDateFilter(container, user) {
  const sel   = container.querySelector('#filter-date');
  if (!sel) return;
  const cur   = sel.value;
  const dates = [...new Set(slotsDB.byClassroom(user.classroomId).map(s => s.date))].sort();
  sel.innerHTML = `<option value="">全部日期</option>` + dates.map(d => `<option value="${d}" ${d === cur ? 'selected' : ''}>${fmtDate(d)}</option>`).join('');
}

function renderBookingsTable(container, user) {
  const tbody  = container.querySelector('#bk-tbody');
  const fDate  = container.querySelector('#bk-filter-date')?.value || '';
  const fSub   = container.querySelector('#bk-filter-sub')?.value || '';
  const fStatus= container.querySelector('#bk-filter-status')?.value || '';

  const slotIds = slotsDB.byClassroom(user.classroomId).map(s => s.id);
  let bookings  = bookingsDB.all()
    .filter(b => slotIds.includes(b.slotId))
    .filter(b => !fStatus || b.status === fStatus);

  if (fDate || fSub) {
    bookings = bookings.filter(b => {
      const slot = slotsDB.get(b.slotId);
      return (!fDate || slot?.date === fDate) && (!fSub || slot?.subject === fSub);
    });
  }

  bookings.sort((a, b) => {
    const sa = slotsDB.get(a.slotId), sb = slotsDB.get(b.slotId);
    return (sa?.date || '').localeCompare(sb?.date || '') || (sa?.time || '').localeCompare(sb?.time || '');
  });

  if (!bookings.length) { tbody.innerHTML = `<tr><td colspan="7" class="table-empty">查無符合的預約</td></tr>`; return; }

  const statusMap = { pending: ['待診斷','badge-amber'], done: ['已完成','badge-green'], cancelled: ['已取消','badge-gray'] };
  const colors = ['av-green','av-amber','av-blue'];

  tbody.innerHTML = bookings.map((b, i) => {
    const slot  = slotsDB.get(b.slotId);
    const grade = GRADES.find(g => g.id === b.gradeId);
    const [statusLabel, statusCls] = statusMap[b.status] || ['未知','badge-gray'];
    const rec   = recordsDB.byBooking(b.id);
    return `<tr>
      <td>
        <div class="flex items-center gap-8">
          <div class="avatar ${colors[i%3]}">${b.studentName.slice(-1)}</div>
          <div>
            <div class="fw-600 text-zh">${b.studentName}</div>
            <div class="text-xs text-muted">${b.phone}</div>
          </div>
        </div>
      </td>
      <td>${grade?.label || '-'}</td>
      <td><span class="badge badge-blue">${b.subject}</span></td>
      <td>${slot ? fmtDate(slot.date) : '-'}</td>
      <td style="font-family:var(--font-body);font-weight:600">${slot?.time || '-'}</td>
      <td><span class="badge ${statusCls}">${statusLabel}${rec ? ' ✓' : ''}</span></td>
      <td class="flex gap-8">
        <button class="btn btn-sm btn-primary" data-open-record="${b.id}">
          ${icon('edit','icon')} ${b.status === 'done' ? '查看' : '填寫'}紀錄
        </button>
      </td>
    </tr>`;
  }).join('');

  tbody.querySelectorAll('[data-open-record]').forEach(btn => {
    btn.addEventListener('click', () => openRecordModal(container, user, btn.dataset.openRecord));
  });
}

function openRecordModal(container, user, bookingId) {

  const grade = GRADES.find(g => g.id === b?.gradeId);

  container.querySelector('#record-modal-title').textContent =

  container.querySelector('#record-modal-body').innerHTML = `
    <div class="flex items-center gap-12 mb-16 p-12" style="background:var(--gray-50);border-radius:var(--radius-md)">
      <div class="score-ring">${rec.score ?? '--'}</div>
      <div class="text-zh" style="font-size:.875rem;line-height:1.9">
        <div><strong>學生：</strong>${b.studentName} ／ ${grade?.label || ''}</div>
        <div><strong>科目：</strong>${b.subject}</div>
        <div><strong>時間：</strong>${slot ? fmtDate(slot.date)+' '+slot.time : '-'}</div>

      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">整體評分（0–100）</label>
        <div class="score-input-wrap">
          <div class="score-preview" id="score-preview-val">${rec.score ?? '--'}</div>
          <input id="rec-score" type="number" min="0" max="100" class="form-control score-field" value="${rec.score ?? ''}">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">建議課程方案</label>
        <select id="rec-plan" class="form-control">
          ${plans.map(p => `<option ${rec.plan === p ? 'selected' : ''}>${p}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">強項能力</label>
      <input id="rec-strength" type="text" class="form-control" placeholder="如：計算能力佳、閱讀理解強" value="${rec.strength || ''}">
    </div>
    <div class="form-group">
      <label class="form-label">待加強項目</label>
      <input id="rec-weakness" type="text" class="form-control" placeholder="如：應用題理解、文字題判斷" value="${rec.weakness || ''}">
    </div>
    <div class="form-group">
      <label class="form-label">教師建議</label>
      <textarea id="rec-note" class="form-control">${rec.note || ''}</textarea>
    </div>
    <div id="rec-save-error" class="form-error hidden"></div>
    <div class="modal-footer">
      <button class="btn" id="rec-cancel">取消</button>
      <button class="btn btn-primary" id="rec-save">儲存紀錄 & 標記完成</button>
    </div>`;

  // Live score preview
  container.querySelector('#rec-score').addEventListener('input', e => {
    container.querySelector('#score-preview-val').textContent = e.target.value || '--';
  });
  container.querySelector('#rec-cancel').addEventListener('click', () => modal.classList.add('hidden'));
  container.querySelector('#rec-save').addEventListener('click', () => {
    const score = container.querySelector('#rec-score').value;
    recordsDB.upsert({
      bookingId,
      score:    score !== '' ? Number(score) : null,
      strength: container.querySelector('#rec-strength').value.trim(),
      weakness: container.querySelector('#rec-weakness').value.trim(),
      plan:     container.querySelector('#rec-plan').value,
      note:     container.querySelector('#rec-note').value.trim(),
      savedAt:  new Date().toISOString(),
      teacherId: user.id,
    });
    bookingsDB.update(bookingId, { status: 'done' });
    modal.classList.add('hidden');
    renderBookingsTable(container, user);
    showToast('紀錄已儲存', 'success');
  });

  modal.classList.remove('hidden');
}

// ── Toast helper ───────────────────────────────────────────────────────────
function showToast(msg, type = '') {
  let tc = document.querySelector('.toast-container');
  if (!tc) { tc = document.createElement('div'); tc.className = 'toast-container'; document.body.appendChild(tc); }
  const t = document.createElement('div');
  t.className = `toast${type ? ' toast-'+type : ''}`;
  t.textContent = msg;
  tc.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}



// ── 管理員：數據總覽 ───────────────────────────────────────────────────────
function renderAdminOverview(container) {
  const classrooms = classroomsDB.all();
  const allBookings = bookingsDB.all();
  const allRecords  = recordsDB.all();
  const scores = allRecords.filter(r => r.score != null).map(r => Number(r.score));
  const avgScore = scores.length ? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length) : null;
  const doneCount = allBookings.filter(b => b.status === 'done').length;
  const rate = allBookings.length ? Math.round(doneCount / allBookings.length * 100) : 0;

  // Subject stats
  const subStats = {};
  SUBJECTS.forEach(s => subStats[s] = 0);
  allBookings.forEach(b => {
    const slot = slotsDB.get(b.slotId);
    if (slot) subStats[slot.subject] = (subStats[slot.subject] || 0) + 1;
  });
  const total = allBookings.length || 1;

  // Per-classroom stats
  const cStats = classrooms.map(c => ({ c, s: statsForClassroom(c.id) })).sort((a,b)=>b.s.total-a.s.total);
  const maxTotal = Math.max(...cStats.map(x=>x.s.total), 1);

  container.innerHTML = `

  <div class="page-subtitle">全加盟教室彙整統計</div>

  <div class="stat-card"><div class="stat-label">診斷完成</div><div class="stat-value blue-val">${doneCount}</div></div>
  <div class="stat-card"><div class="stat-label">完成率</div><div class="stat-value blue-val">${rate}%</div></div>
  <div class="stat-card"><div class="stat-label">全局平均分</div><div class="stat-value amber">${avgScore ?? '—'}</div></div>
  <div class="stat-card"><div class="stat-label">加盟教室數</div><div class="stat-value">${classrooms.length}</div></div>
  <div class="stat-card"><div class="stat-label">教師帳號</div><div class="stat-value">${accountsDB.all().filter(a=>a.role==='teacher').length}</div></div>
</div>

<div class="grid-2">
  <div class="card">
    <div class="card-title">各教室預約量</div>
    <div class="bar-chart">
      ${cStats.map(({c,s}) => `
        <div class="bar-col">
          <div class="bar-val">${s.total}</div>
          <div class="bar" style="height:${Math.max(s.total/maxTotal*100,4)}%"></div>
          <div class="bar-label">${c.name.replace('教室','')}</div>
        </div>
      `).join('')}
    </div>
  </div>
  <div class="card">
    <div class="card-title">科目診斷分佈</div>
    ${SUBJECTS.map(s => {
      const count = subStats[s] || 0;
      const pct   = Math.round(count / total * 100);
      return `
      <div class="mb-16">
        <div class="flex justify-between mb-8">
          <span class="text-zh fw-600" style="font-size:.875rem">${s}</span>
          <span class="text-muted" style="font-size:.8rem">${count} 件（${pct}%）</span>
        </div>
        <div class="progress"><div class="progress-fill" style="width:${pct}%"></div></div>
      </div>`;
    }).join('')}
  </div>
</div>

<div class="card">
  <div class="card-title">教室詳細數據</div>
  <div class="table-wrap">
    <table class="table">
      <thead><tr><th>教室</th><th>累計預約</th><th>已完成</th><th>完成率</th><th>平均分</th><th>最熱門科目</th></tr></thead>
      <tbody>
        ${cStats.map(({c,s}) => {
          const r = s.total ? Math.round(s.done/s.total*100) : 0;
          const hotSub = Object.entries(s.subjectMap).sort((a,b)=>b[1]-a[1])[0];
          return `<tr>
            <td class="fw-600 text-zh">${c.name}</td>
            <td>${s.total}</td>
            <td>${s.done}</td>
            <td>

                <span style="font-size:.8rem">${r}%</span>

            <td>${hotSub && hotSub[1] > 0 ? `<span class="badge badge-blue">${hotSub[0]}</span>` : '—'}</td>

        }).join('')}
      </tbody>
    </table>
  </div>
</div>`;
}

function bindClassroomEvents(container) {
  renderClassroomsTable(container);
  container.querySelector('#btn-add-cls').addEventListener('click', () => {
    const name = container.querySelector('#new-cls-name').value.trim();
    const addr = container.querySelector('#new-cls-addr').value.trim();
    const err  = container.querySelector('#cls-add-error');
    if (!name) { err.textContent='請輸入教室名稱'; err.classList.remove('hidden'); return; }
    err.classList.add('hidden');
    classroomsDB.add({ id: uid('cls'), name, address: addr });
    container.querySelector('#new-cls-name').value = '';
    container.querySelector('#new-cls-addr').value = '';
    renderClassroomsTable(container);
    showToast('教室已新增', 'success');
  });
}

function renderClassroomsTable(container) {
  const tbody = container.querySelector('#cls-tbody');
  const list  = classroomsDB.all();
  if (!list.length) { tbody.innerHTML = `<tr><td colspan="5" class="table-empty">尚無教室</td></tr>`; return; }

  tbody.innerHTML = list.map(c => {
    const teachers = accountsDB.all().filter(a => a.classroomId === c.id && a.role === 'teacher').length;
    const bookings = bookingsDB.byClassroom(c.id).length;
    return `<tr>
      <td class="fw-600 text-zh">${c.name}</td>
      <td class="text-muted">${c.address || '—'}</td>
      <td>${teachers}</td>
      <td>${bookings}</td>
      <td>
        <button class="btn btn-sm" data-edit-cls="${c.id}">${icon('edit','icon')} 編輯</button>
      </td>
    </tr>`;
  }).join('');
}

function bindAccountEvents(container) {
  renderAccountsTable(container);
  container.querySelector('#acc-filter-role').addEventListener('change', () => renderAccountsTable(container));
  container.querySelector('#new-acc-role').addEventListener('change', e => {
    container.querySelector('#new-acc-cls').closest('.form-group').style.opacity = e.target.value === 'admin' ? '.4' : '1';
  });

  container.querySelector('#btn-add-acc').addEventListener('click', () => {
    const name = container.querySelector('#new-acc-name').value.trim();
    const user = container.querySelector('#new-acc-user').value.trim();
    const pass = container.querySelector('#new-acc-pass').value;
    const role = container.querySelector('#new-acc-role').value;
    const cid  = container.querySelector('#new-acc-cls').value;
    const err  = container.querySelector('#acc-add-error');

    if (!name || !user || !pass) { err.textContent = '請填寫姓名、帳號與密碼'; err.classList.remove('hidden'); return; }
    if (role === 'teacher' && !cid) { err.textContent = '教師帳號請選擇所屬教室'; err.classList.remove('hidden'); return; }
    if (accountsDB.all().find(a => a.username === user)) { err.textContent = '此帳號名稱已存在'; err.classList.remove('hidden'); return; }
    err.classList.add('hidden');

    accountsDB.add({ id: uid('u'), name, role, classroomId: cid || null, username: user, password: pass, active: true });
    ['#new-acc-name','#new-acc-user','#new-acc-pass'].forEach(s => container.querySelector(s).value = '');
    container.querySelector('#new-acc-cls').value = '';
    renderAccountsTable(container);
    showToast('帳號已建立', 'success');
  });
}

function renderAccountsTable(container) {
  const tbody  = container.querySelector('#acc-tbody');
  const filter = container.querySelector('#acc-filter-role')?.value || '';
  let list = accountsDB.all().filter(a => !filter || a.role === filter);

  if (!list.length) { tbody.innerHTML = `<tr><td colspan="6" class="table-empty">查無帳號</td></tr>`; return; }

  tbody.innerHTML = list.map(a => {
    const cls = a.classroomId ? classroomsDB.get(a.classroomId) : null;
    return `<tr>
      <td>
        <div class="flex items-center gap-8">
          <div class="avatar av-green">${a.name.slice(-1)}</div>
          <span class="fw-600 text-zh">${a.name}</span>
        </div>
      </td>
      <td class="text-muted" style="font-family:var(--font-body)">${a.username}</td>
      <td><span class="badge ${a.role==='admin'?'badge-amber':'badge-blue'}">${a.role==='admin'?'管理員':'教師'}</span></td>
      <td class="text-zh">${cls?.name || '—'}</td>
      <td><span class="badge ${a.active?'badge-green':'badge-red'}">${a.active?'啟用':'停用'}</span></td>
      <td class="flex gap-8">
        <button class="btn btn-sm" data-toggle-acc="${a.id}" data-active="${a.active}">
          ${a.active ? '停用' : '啟用'}
        </button>
        <button class="btn btn-sm" data-reset-pw="${a.id}">${icon('edit','icon')} 改密碼</button>
      </td>
    </tr>`;
  }).join('');

  tbody.querySelectorAll('[data-toggle-acc]').forEach(btn => {
    btn.addEventListener('click', () => {
      const active = btn.dataset.active === 'true';
      if (!confirm(`確定要${active?'停用':'啟用'}此帳號？`)) return;
      accountsDB.update(btn.dataset.toggleAcc, { active: !active });
      renderAccountsTable(container);
      showToast(`帳號已${active?'停用':'啟用'}`);
    });
  });

  tbody.querySelectorAll('[data-reset-pw]').forEach(btn => {
    btn.addEventListener('click', () => {
      const pw = prompt('請輸入新密碼（至少6位）');
      if (!pw || pw.length < 6) { showToast('密碼至少需要6位', 'error'); return; }
      accountsDB.update(btn.dataset.resetPw, { password: pw });
      showToast('密碼已更新', 'success');
    });
  });
}

  const nav = isAdmin
    ? [
        { id: 'admin-overview',   label: '數據總覽',   ic: 'chart-bar' },
        { id: 'admin-classrooms', label: '教室管理',   ic: 'office' },
        { id: 'admin-accounts',   label: '帳號管理',   ic: 'shield' },
      ]
    : [
        { id: 'teacher-slots',    label: '時段管理',   ic: 'calendar' },
        { id: 'teacher-bookings', label: '預約名單',   ic: 'users' },
      ];

  const sidebarItems = nav.map(n =>
    `<div class="sidebar-item ${n === nav[0] ? 'active' : ''}" data-page="${n.id}">
      ${icon(n.ic, 'icon')} ${n.label}
    </div>`
  ).join('');

  document.body.innerHTML = `
<div class="app-shell">
  <div class="topbar">
    ${icon('school', 'icon')}
    <span class="topbar-logo">學力診斷預約系統</span>
    <div class="topbar-spacer"></div>
    <div class="topbar-user">
      <div class="avatar">${currentUser.name.slice(-1)}</div>
      <span>${currentUser.name}${isAdmin ? '（管理員）' : ' 老師'}</span>
      <button class="btn-logout" id="btn-logout">${icon('logout','icon')} 登出</button>
    </div>
  </div>
  <div class="layout">
    <div class="sidebar">${sidebarItems}</div>
    <div class="main-content" id="main-content"></div>
  </div>
</div>
<div class="toast-container"></div>`;

  const mainContent = document.getElementById('main-content');

  // Sidebar nav
  document.querySelectorAll('.sidebar-item').forEach(item => {
    item.addEventListener('click', () => {
      document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
      item.classList.add('active');
      renderPage(item.dataset.page, mainContent);
    });
  });

  // Logout
  document.getElementById('btn-logout').addEventListener('click', () => {
    sessionStorage.removeItem('ld_user');
    currentUser = null;
    showEntryScreen();
  });

  // Render first page
  renderPage(nav[0].id, mainContent);
}

function renderPage(pageId, container) {
  container.innerHTML = '';
  switch (pageId) {
    case 'admin-overview':   renderAdminOverview(container); break;
    case 'admin-classrooms': renderAdminClassrooms(container); break;
    case 'admin-accounts':   renderAdminAccounts(container); break;
    case 'teacher-slots':    renderTeacherSlots(container, currentUser); break;
    case 'teacher-bookings': renderTeacherBookings(container, currentUser); break;
  }
}

</script>
</body>
</html>
