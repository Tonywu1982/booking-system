    if (method === 'POST' || method === 'PATCH') headers['Prefer'] = 'return=representation';
  }
  const res = await fetch(url, { method, headers, body: body ? JSON.stringify(body) : undefined });
  if (!res.ok) {
    const err = await res.text();
    console.error(`Supabase ${method} ${table} error:`, err);
    throw new Error(`Supabase ${method} ${table}: ${res.status} ${err.slice(0,200)}`);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : [];
}

// ── 載入狀態管理 ────────────────────────────────────────────────────────
let _cache = { classrooms: null, accounts: null, slots: null, bookings: null, records: null };

async function loadAll() {
  showGlobalLoading(true);
  try {
    // Load sequentially to avoid overwhelming free tier
    _cache.classrooms = await DB.allClassrooms();
    _cache.accounts   = await DB.allAccounts();
    _cache.slots      = await DB.allSlots();
    _cache.bookings   = await DB.allBookings();
    _cache.records    = await DB.allRecords();
  } catch(e) {
    console.error('loadAll error', e);
    showGlobalLoading(false);
    throw e;
  }
  showGlobalLoading(false);
}

function showGlobalLoading(show) {
  let el = document.getElementById('global-loading');
  if (!el) {
    el = document.createElement('div');
    el.id = 'global-loading';
    el.style.cssText = 'position:fixed;inset:0;background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;z-index:9999;font-family:var(--font-zh);font-size:1rem;color:#1E1E1E;gap:12px;flex-direction:column';
    el.innerHTML = '<div style="width:36px;height:36px;border:3px solid #7DCDF4;border-top-color:#1E1E1E;border-radius:50%;animation:spin .7s linear infinite"></div><div>資料載入中...</div>';
    const style = document.createElement('style');
    style.textContent = '@keyframes spin{to{transform:rotate(360deg)}}';
    document.head.appendChild(style);
    document.body.appendChild(el);
  }
  el.style.display = show ? 'flex' : 'none';
}


// ── Cache-based DB shims（讀取 _cache，寫入時同步遠端）────────────────────
const classroomsDB = {
  all:    ()    => _cache.classrooms || [],
  get:    id    => (_cache.classrooms||[]).find(c => c.id === id) || null,
  update: async (id, patch) => {
    await DB.updateClassroom(id, patch);
    _cache.classrooms = (_cache.classrooms||[]).map(c => c.id===id ? {...c,...patch} : c);
  },
};

const accountsDB = {
  all:    ()          => _cache.accounts || [],
  get:    id          => (_cache.accounts||[]).find(a => a.id === id) || null,
  login:  (u, p)      => (_cache.accounts||[]).find(a => a.username===u && a.password===p && (a.active===true||a.active==='true')) || null,
  add:    async acc   => {
    const rows = await DB.upsertAccount({ ...acc, classroom_id: acc.classroomId });
    const saved = Array.isArray(rows) ? rows[0] : rows;
    _cache.accounts = [...(_cache.accounts||[]), { ...acc, ...saved }];
  },
  update: async (id, patch) => {
    const dbPatch = { ...patch };
    if ('classroomId' in dbPatch) { dbPatch.classroom_id = dbPatch.classroomId; delete dbPatch.classroomId; }
    await DB.updateAccount(id, dbPatch);
    _cache.accounts = (_cache.accounts||[]).map(a => a.id===id ? {...a,...patch} : a);
  },
  save:   async list  => { _cache.accounts = list; },
  delete: async id    => {
    await DB.deleteAccount(id);
    _cache.accounts = (_cache.accounts||[]).filter(a => a.id !== id);
  },
};

const slotsDB = {
  all:          ()    => _cache.slots || [],
  byClassroom:  cid   => (_cache.slots||[]).filter(s => s.classroomId === cid || s.classroom_id === cid),
  get:          id    => (_cache.slots||[]).find(s => s.id === id) || null,
  add:    async slot  => {
    const dbSlot = { id: slot.id, classroom_id: slot.classroomId, date: slot.date, time: slot.time, capacity: slot.capacity };
    await DB.insertSlot(dbSlot);
    _cache.slots = [...(_cache.slots||[]), slot];
  },
  delete: async id    => {
    await DB.deleteSlot(id);
    _cache.slots = (_cache.slots||[]).filter(s => s.id !== id);
  },
  update: (id, patch) => {
    _cache.slots = (_cache.slots||[]).map(s => s.id===id ? {...s,...patch} : s);
  },
};

const bookingsDB = {
  all:         ()    => _cache.bookings || [],
  bySlot:      sid   => (_cache.bookings||[]).filter(b => b.slotId === sid || b.slot_id === sid),
  byClassroom: cid   => (_cache.bookings||[]).filter(b => b.classroomId === cid || b.classroom_id === cid),
  get:         id    => (_cache.bookings||[]).find(b => b.id === id) || null,
  add:   async bk    => {
    const dbBk = {
      id: bk.id, slot_id: bk.slotId, classroom_id: bk.classroomId,
      student_name: bk.studentName, parent_name: bk.parentName||'',
      phone: bk.phone, grade_id: bk.gradeId, subject: bk.subject||'',
      note: bk.note||'', status: bk.status||'pending',
    };
    await DB.insertBooking(dbBk);
    _cache.bookings = [...(_cache.bookings||[]), bk];
  },
  update: async (id, patch) => {
    // Convert camelCase patch keys to snake_case for Supabase
    const dbPatch = {};
    const keyMap = {
      studentName: 'student_name', parentName: 'parent_name',
      classroomId: 'classroom_id', slotId: 'slot_id',
      gradeId: 'grade_id', createdAt: 'created_at',
      cancelReason: 'cancel_reason', cancelledAt: 'cancelled_at',
      cancelledBy: 'cancelled_by',
    };
    Object.entries(patch).forEach(([k, v]) => {
      dbPatch[keyMap[k] || k] = v;
    });
    await DB.updateBooking(id, dbPatch);
    _cache.bookings = (_cache.bookings||[]).map(b => b.id===id ? {...b,...patch} : b);
  },
};

const recordsDB = {
  all:         ()    => _cache.records || [],
  byBooking:   bid   => (_cache.records||[]).find(r => r.bookingId === bid || r.booking_id === bid) || null,
  byClassroom: cid   => {
    const bids = bookingsDB.byClassroom(cid).map(b => b.id);
    return (_cache.records||[]).filter(r => bids.includes(r.bookingId||r.booking_id));
  },
  upsert: async rec  => {
    const dbRec = {
      booking_id:      rec.bookingId,
      outcome:         rec.outcome,
      other_note:      rec.otherNote||'',
      absent_reason:   rec.absentReason||'',
      absent_followup: rec.absentFollowup||'',
      teacher_id:      rec.teacherId||'',
      saved_at:        rec.savedAt||new Date().toISOString(),
    };
    await DB.upsertRecord(dbRec);
    const list = (_cache.records||[]).filter(r => (r.bookingId||r.booking_id) !== rec.bookingId);
    list.push(rec);
    _cache.records = list;
  },
};

function statsForClassroom(cid) {
  const slots    = slotsDB.byClassroom(cid);
  const bookings = bookingsDB.byClassroom(cid);
  const records  = recordsDB.byClassroom(cid);
  const total    = bookings.length;
  const done     = bookings.filter(b => b.status === 'done').length;
  const pending  = bookings.filter(b => b.status === 'pending').length;
  const scores   = records.filter(r => r.score != null).map(r => Number(r.score));
  const avgScore = scores.length ? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length) : null;
  const subjectMap = {};
  SUBJECTS.forEach(s => { subjectMap[s] = 0; });
  bookings.forEach(b => { if (b.subject) subjectMap[b.subject] = (subjectMap[b.subject]||0)+1; });
  return { total, done, pending, avgScore, subjectMap, slotCount: slots.length };
}

// normalize field names (Supabase returns snake_case, JS uses camelCase)
function normalizeClassroom(c) {
  const parsed = parseAddressCityDistrict(c.address||'');
  return {
    ...c,
    city:     c.city     || parsed.city,
    district: c.district || parsed.district,
    active:   c.active !== false && c.active !== 'false',
  };
}

function normalizeBooking(b) {
  return {
    ...b,
    slotId:       b.slotId      || b.slot_id,
    classroomId:  b.classroomId || b.classroom_id,
    studentName:  b.studentName || b.student_name,
    parentName:   b.parentName  || b.parent_name  || '',
    gradeId:      b.gradeId     ?? b.grade_id,
    cancelReason: b.cancelReason || b.cancel_reason || '',
    cancelledBy:  b.cancelledBy  || b.cancelled_by  || '',
    cancelledAt:  b.cancelledAt  || b.cancelled_at  || '',
  };
}
function normalizeRecord(r) {
  return { ...r, bookingId: r.bookingId || r.booking_id, otherNote: r.otherNote || r.other_note || '', absentReason: r.absentReason || r.absent_reason || '', absentFollowup: r.absentFollowup || r.absent_followup || '' };
}
function normalizeSlot(s) {
  return { ...s, classroomId: s.classroomId || s.classroom_id };
}
function normalizeAccount(a) {
  return { ...a, classroomId: a.classroomId || a.classroom_id };
}

async function initData() {
  try {
    await loadAll();
    // 如果教室資料是空的，種入初始資料
    if (_cache.classrooms.length === 0) {
      showGlobalLoading(true);
      // 批次 insert 教室（分批避免超時）
      const CLS = DEFAULT_CLASSROOMS;
      for (let i = 0; i < CLS.length; i += 20) {
        await supaFetch('POST','classrooms',CLS.slice(i,i+20),{on_conflict:'id'});
      }
      // 批次 insert 帳號（分批）
      const accRows = DEFAULT_ACCOUNTS.map(a => ({
        id: a.id, name: a.name, role: a.role,
        classroom_id: a.classroomId || null,
        username: a.username, password: a.password, active: a.active
      }));
      for (let i = 0; i < accRows.length; i += 20) {
        await supaFetch('POST','accounts',accRows.slice(i,i+20),{on_conflict:'id'});
      }
      await loadAll();
    }
    // normalize cache
    _cache.slots    = (_cache.slots||[]).map(normalizeSlot);
    _cache.bookings = (_cache.bookings||[]).map(normalizeBooking);
    _cache.records  = (_cache.records||[]).map(normalizeRecord);
    _cache.accounts = (_cache.accounts||[]).map(normalizeAccount);
  } catch(e) {
    console.error('initData error', e);
    console.error('DB init failed:', e);
    document.body.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f4f6fb;padding:20px"><div style="background:#fff;border-radius:16px;padding:32px;max-width:400px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.1)"><div style="font-size:2rem;margin-bottom:12px">⚠️</div><div style="font-size:1rem;font-weight:700;margin-bottom:8px;font-family:var(--font-zh)">資料庫連線失敗</div><div style="font-size:.85rem;color:#888;margin-bottom:16px;font-family:var(--font-zh)">錯誤：${e.message}</div><button onclick="location.reload()" style="background:#1E1E1E;color:#fff;border:none;border-radius:8px;padding:10px 24px;cursor:pointer;font-family:var(--font-zh)">重新整理</button></div></div>`;
  }
}

function uid(prefix = 'id') {
  return `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;
}

// ── 格式化日期 ────────────────────────────────────────────────────────────
function fmtDate(isoDate) {
  const d = new Date(isoDate + 'T00:00:00');
  const days = ['日','一','二','三','四','五','六'];
  return `${d.getMonth()+1}/${d.getDate()}（週${days[d.getDay()]}）`;
}

function fmtDateTime(isoDate, time) {
  return `${fmtDate(isoDate)} ${time}`;
}

    const u = document.querySelector('#login-user').value.trim();
    const p = document.querySelector('#login-pass').value;
    console.log('[login] trying:', u, p);
    console.log('[login] cache accounts count:', (_cache.accounts||[]).length);
    // Try cache first
    let user = accountsDB.login(u, p);
    console.log('[login] cache result:', user);
    // Fallback: direct DB query (no filter on active/password - get by username then check)
    if (!user) {
      try {
        const rows = await supaFetch('GET', 'accounts', null, {
          username: `eq.${u}`, select: '*', limit: '1'
        });
        console.log('[login] DB rows:', JSON.stringify(rows));
        if (rows && rows.length > 0) {
          const row = rows[0];
          if (row.password === p && (row.active === true || row.active === 'true')) {
            user = normalizeAccount(row);
            if (!(_cache.accounts||[]).find(a => a.id === user.id)) {
              _cache.accounts = [...(_cache.accounts||[]), user];
            }
          } else {
            console.log('[login] password mismatch or inactive. DB pw:', row.password, 'input pw:', p, 'active:', row.active);
          }
        } else {
          console.log('[login] no user found with username:', u);
        }
      } catch(e) { console.error('[login] query error', e); }
    }
    if (user) {
      onLogin(user);
    } else {
      document.querySelector('#login-error').classList.remove('hidden');
      document.querySelector('#login-pass').value = '';
      document.querySelector('#login-pass').focus();
    }
  };

  document.querySelector('#login-pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

}

// ── 解析地址取得 city / district（前端版）───────────────────────────────
function parseAddressCityDistrict(addr) {
  if (!addr) return { city: '', district: '' };
  const cities = ['台北市','新北市','桃園市','台中市','台南市','高雄市',
    '新竹市','新竹縣','基隆市','宜蘭縣','花蓮縣','台東縣',
    '苗栗縣','彰化縣','南投縣','雲林縣','嘉義市','嘉義縣',
    '屏東縣','澎湖縣'];
  let city = '';
  for (const c of cities) {
    if (addr.startsWith(c)) { city = c; break; }
  }
  const rest = addr.slice(city.length);
  const m = rest.match(/^(.{1,4}?[區鎮鄉])/);
  const district = m ? m[1] : '';
  return { city, district };
}

function buildActiveHierarchy() {
  const hier = {};
  const CITY_ORDER = ['基隆市','台北市','新北市','桃園市','新竹市','新竹縣','苗栗縣',
    '台中市','彰化縣','南投縣','雲林縣','嘉義市','嘉義縣',
    '台南市','高雄市','屏東縣','宜蘭縣','花蓮縣','台東縣','澎湖縣'];

  classroomsDB.all()
    .filter(c => c.active !== false)
    .forEach(c => {
      const city = c.city || '其他';
      const dist = c.district || '其他';
      if (!hier[city]) hier[city] = {};
      if (!hier[city][dist]) hier[city][dist] = [];
      hier[city][dist].push({ id: c.id, label: `${c.name}`, phone: c.phone||'', address: c.address||'' });
    });

  // 排序：縣市北到南，地區字母順序
  const sorted = {};
  CITY_ORDER.forEach(city => { if (hier[city]) sorted[city] = hier[city]; });
  Object.keys(hier).forEach(city => { if (!sorted[city]) sorted[city] = hier[city]; });
  return sorted;
}

function buildActiveCityOptions() {
  const hier = buildActiveHierarchy();
  return Object.keys(hier).map(c => `<option value="${c}">${c}</option>`).join('');
}

let selectedSlotId = null;
let step1Data = {};

function bindParentEvents(container) {
  selectedSlotId = null;
  step1Data = {};

  // Step 1 → Step 2
  container.querySelector('#btn-otp').addEventListener('click', () => {
    const phone = container.querySelector('#p-phone').value.trim();
    if (!phone) { alert('請先填寫手機號碼'); return; }
    alert('【功能規劃中】實際上線後將發送 OTP 驗證碼至 ' + phone);
  });
  // 縣市 → 地區聯動
  container.querySelector('#p-city').addEventListener('change', function() {
    const city    = this.value;
    const hier    = buildActiveHierarchy();
    const distSel = container.querySelector('#p-district');
    const distGrp = container.querySelector('#p-dist-group');
    const clsGrp  = container.querySelector('#p-cls-group');
    const clsSel  = container.querySelector('#p-classroom');
    distSel.innerHTML = '<option value="">-- 請選擇地區 --</option>';
    clsSel.innerHTML  = '<option value="">-- 請選擇教室 --</option>';
    clsGrp.classList.add('hidden');
    if (!city) { distGrp.classList.add('hidden'); return; }
    distGrp.classList.remove('hidden');
    Object.keys(hier[city]||{}).sort().forEach(d => {
      distSel.innerHTML += `<option value="${d}">${d}</option>`;
    });
  });

  container.querySelector('#p-district').addEventListener('change', function() {
    const city   = container.querySelector('#p-city').value;
    const dist   = this.value;
    const hier   = buildActiveHierarchy();
    const clsSel = container.querySelector('#p-classroom');
    const clsGrp = container.querySelector('#p-cls-group');
    clsSel.innerHTML = '<option value="">-- 請選擇教室 --</option>';
    if (!dist) { clsGrp.classList.add('hidden'); return; }
    clsGrp.classList.remove('hidden');
    (hier[city]?.[dist] || []).forEach(c => {
      clsSel.innerHTML += `<option value="${c.id}">${c.label}</option>`;
    });
  });

  container.querySelector('#btn-to-step2').addEventListener('click', () => {
    const name       = container.querySelector('#p-name').value.trim();
    const parentName = container.querySelector('#p-parent-name').value.trim();
    const phone      = container.querySelector('#p-phone').value.trim();
    const gradeId    = container.querySelector('#p-grade').value;
    const subject    = container.querySelector('#p-subject').value;
    const cid        = container.querySelector('#p-classroom').value;
    const note       = container.querySelector('#p-note').value.trim();
    const errEl      = container.querySelector('#p-step1-error');

    if (!name || !parentName) {
      errEl.textContent = '請填寫學生姓名與家長姓名';
      errEl.classList.remove('hidden');
      return;
    }
    if (!phone) {
      errEl.textContent = '請填寫聯絡電話';
      errEl.classList.remove('hidden');
      return;
    }
    if (!cid) {
      errEl.textContent = '請選擇縣市、地區與教室';
      errEl.classList.remove('hidden');
      return;
    }
    errEl.classList.add('hidden');
    step1Data = { name, parentName, phone, gradeId: Number(gradeId), subject, classroomId: cid, note };

    renderSlotPicker(container, cid);
    goToStep(container, 2);
  });

  // Step 2 → Step 1
  container.querySelector('#btn-back-step1').addEventListener('click', () => goToStep(container, 1));

  // Step 2 → Confirm
  container.querySelector('#btn-to-step3').addEventListener('click', async () => {
    if (!selectedSlotId) {
      const errEl = container.querySelector('#p-step2-error');
      errEl.textContent = '請選擇一個可用時段';
      errEl.classList.remove('hidden');
      return;
    }
    await confirmBooking(container);
  });

  // New booking
  container.querySelector('#btn-new-booking').addEventListener('click', () => {
    selectedSlotId = null;
    step1Data = {};
    container.querySelector('#p-name').value = '';
    container.querySelector('#p-parent-name').value = '';
    container.querySelector('#p-phone').value = '';
    container.querySelector('#p-note').value = '';
    container.querySelector('#p-city').value = '';
    container.querySelector('#p-district').innerHTML = '<option value="">-- 請選擇地區 --</option>';
    container.querySelector('#p-classroom').innerHTML = '<option value="">-- 請選擇教室 --</option>';
    container.querySelector('#p-dist-group').classList.add('hidden');
    container.querySelector('#p-cls-group').classList.add('hidden');
    goToStep(container, 1);
  });

  // Query bookings
  container.querySelector('#btn-query').addEventListener('click', () => {
    const phone = container.querySelector('#query-phone').value.trim();
    renderQueryResult(container, phone);
  });
  container.querySelector('#query-phone').addEventListener('keydown', e => {
    if (e.key === 'Enter') container.querySelector('#btn-query').click();
  });
}

function goToStep(container, step) {
  [1, 2, 3].forEach(n => {
    container.querySelector(`#parent-step-${n}`).classList.toggle('hidden', n !== step);
    const dot = container.querySelector(`#step-${n}`);
    dot.classList.remove('active', 'done');
    if (n < step) dot.classList.add('done');
    else if (n === step) dot.classList.add('active');
    if (n < 3) {
      const line = container.querySelector(`#line-${n}`);
      line.classList.toggle('done', n < step);
    }
  });
}

function renderSlotPicker(container, classroomId) {
  selectedSlotId = null;
  const area = container.querySelector('#slot-picker-area');
  const settings = getSettings();
  const now = new Date();
  const maxDate = new Date(now.getTime() + settings.bookingWindowDays * 86400000);
  const minTime = new Date(now.getTime() + settings.minHoursAhead * 3600000);

  const slots = slotsDB.byClassroom(classroomId)
    .filter(s => {
      const slotDt = new Date((s.date||s.slot_date) + 'T' + s.time + ':00');
      return slotDt >= minTime && slotDt <= maxDate;  // 在允許範圍內
    })
    .sort((a, b) => (a.date||'').localeCompare(b.date||'') || (a.time||'').localeCompare(b.time||''));

  // Group by date
  const byDate = {};
  slots.forEach(s => {
    if (!byDate[s.date]) byDate[s.date] = [];
    byDate[s.date].push(s);
  });

  if (Object.keys(byDate).length === 0) {
    const windowMsg = `（目前僅顯示 ${settings.minHoursAhead} 小時後至 ${settings.bookingWindowDays} 天內的時段）`;
    area.innerHTML = `<div class="alert alert-amber">${icon('info','icon')} 目前此教室在可預約範圍內無開放時段，請聯絡教室或稍後再查詢。<div class="text-xs mt-8">${windowMsg}</div></div>`;
    return;
  }

  let html = '';
  Object.keys(byDate).sort().forEach(date => {
    html += `<p class="fw-600 text-zh mb-8 mt-12" style="font-size:.875rem;color:var(--gray-700)">📅 ${fmtDate(date)}</p>`;
    html += `<div class="slot-grid">`;
    byDate[date].forEach(slot => {
      const booked = bookingsDB.bySlot(slot.id).length;
      const remain = slot.capacity - booked;
      const full   = remain <= 0;
      html += `
        <div class="slot-card ${full ? 'full' : ''}" data-slot-id="${slot.id}">
          <div class="slot-time">${slot.time}</div>
          <div class="slot-meta">${full ? '<span class="slot-full-label">已額滿</span>' : `剩 ${remain} 位`}</div>
        </div>`;
    });
    html += `</div>`;
  });
  area.innerHTML = html;

  area.querySelectorAll('.slot-card:not(.full)').forEach(el => {
    el.addEventListener('click', () => {
      area.querySelectorAll('.slot-card').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
      selectedSlotId = el.dataset.slotId;
      container.querySelector('#p-step2-error').classList.add('hidden');
    });
  });
}

async function confirmBooking(container) {
  const slot      = slotsDB.get(selectedSlotId);
  const classroom = classroomsDB.get(step1Data.classroomId);
  const grade     = GRADES.find(g => g.id === step1Data.gradeId);
  const booking   = {
    id: uid('bk'),
    slotId: selectedSlotId,
    studentName: step1Data.name,
    parentName: step1Data.parentName,
    phone: step1Data.phone,
    gradeId: step1Data.gradeId,
    subject: step1Data.subject,
    classroomId: step1Data.classroomId,
    note: step1Data.note,
    status: 'pending',
    createdAt: new Date().toISOString(),
  };
  await bookingsDB.add(booking);

  const clsName  = classroom?.name  || '';
  const clsPhone = classroom?.phone || '';
  const clsAddr  = classroom?.address || '';
  const dateStr  = slot ? fmtDate(slot.date) : '';
  const timeStr  = slot?.time || '';

  container.querySelector('#confirm-summary').textContent =
    `${step1Data.parentName} 家長 / ${step1Data.name} 同學 ${step1Data.subject} 學力診斷`;
  container.querySelector('#confirm-detail').innerHTML = `
    <div>🎓 學年：${grade?.label || ''}</div>
    <div>📚 科目：${step1Data.subject}</div>
    <div>🏫 教室：${clsName}</div>
    <div>📍 地址：${clsAddr}</div>
    <div>📅 日期：${dateStr}</div>
    <div>⏰ 時間：${timeStr}</div>
    <div>👤 家長姓名：${step1Data.parentName}</div>
    <div>📞 聯絡電話：${step1Data.phone}</div>
    ${step1Data.note ? `<div>📝 備註：${step1Data.note}</div>` : ''}
  `;

  // LINE 訊息預覽
  const lineMsg = `${step1Data.parentName} 家長您好，${step1Data.name} 同學已預約學力診斷。
📅 ${dateStr} ${timeStr}
🏫 ${clsName}
📍 ${clsAddr}
請準時出席，如有問題請聯絡教室：${clsPhone}`;
  container.querySelector('#line-msg-preview').textContent = lineMsg;

  // Google 行事曆連結
  if (slot) {
    const dateObj = new Date(slot.date + 'T' + slot.time + ':00');
    const endObj  = new Date(dateObj.getTime() + 60 * 60 * 1000); // +1hr
    const fmt = d => d.toISOString().replace(/[-:]/g,'').split('.')[0] + 'Z';
    const gcal = 'https://calendar.google.com/calendar/render?action=TEMPLATE' +
      '&text=' + encodeURIComponent('KUMON 學力診斷 - ' + step1Data.name) +
      '&dates=' + fmt(dateObj) + '/' + fmt(endObj) +
      '&details=' + encodeURIComponent('科目：' + step1Data.subject + '\n教室：' + clsName + '\n地址：' + clsAddr + '\n電話：' + clsPhone) +
      '&location=' + encodeURIComponent(clsAddr);
    container.querySelector('#btn-cal-google').href = gcal;

  // SMS 按鈕（規劃中）
  const smsBtn = container.querySelector('#btn-send-sms');
  if (smsBtn) {
    smsBtn.addEventListener('click', () => {
      alert(`【簡訊功能規劃中】\n\n串接簡訊商（如每日簡訊、MITAKE）後，\n將自動發送以下內容至 ${step1Data.phone}：\n\n${lineMsg}`);
    });
  }

    // ICS 下載
    const ics = [
      'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//KUMON//Booking//TW',
      'BEGIN:VEVENT',
      'DTSTART:' + fmt(dateObj),
      'DTEND:'   + fmt(endObj),
      'SUMMARY:KUMON 學力診斷 - ' + step1Data.name,
      'DESCRIPTION:科目：' + step1Data.subject + '\n教室：' + clsName + '\n電話：' + clsPhone,
      'LOCATION:' + clsAddr,
      'END:VEVENT', 'END:VCALENDAR'
    ].join('\r\n');
    const blob = new Blob([ics], { type: 'text/calendar' });
    container.querySelector('#btn-cal-ics').href = URL.createObjectURL(blob);
  }

  // Email 通知老師（若功能已開啟）
  const settings = getSettings();
  if (settings.emailNotify) {
    const teacherEmail = CLASSROOM_EMAIL_MAP[step1Data.classroomId] || '';
    if (teacherEmail) {
      sendTeacherEmailNotification({
        to: teacherEmail,
        classroomName: clsName,
        studentName: step1Data.name,
        parentName: step1Data.parentName,
        subject: step1Data.subject,
        date: dateStr,
        time: timeStr,
        phone: step1Data.phone,
        note: step1Data.note,
      });
    }
  }

  goToStep(container, 3);
}

function renderQueryResult(container, phone) {
  const result = container.querySelector('#query-result');
  if (!phone) { result.innerHTML = `<div class="form-error">請輸入電話號碼</div>`; return; }

  const allBookings = bookingsDB.all();
  const bookings = allBookings
    .filter(b => b.phone === phone)
    .sort((a, b) => (b.createdAt||'').localeCompare(a.createdAt||''));

  if (bookings.length === 0) {
    result.innerHTML = `<div class="alert alert-amber">${icon('info','icon')} 查無此電話的預約紀錄</div>`;
    return;
  }

  function canCancel(b) {
    if (b.status === 'cancelled') return false;
    const rec = recordsDB.byBooking(b.id);
    if (rec?.outcome) return false;       // 已填寫紀錄不可取消
    const slot = slotsDB.all().find(s => s.id === (b.slotId||b.slot_id));
    if (!slot) return false;
    const slotDt = new Date(slot.date + 'T' + slot.time + ':00');
    return slotDt > new Date();           // 未到診斷時間才可取消
  }

  function buildRows() {
    return bookingsDB.all()
      .filter(b => b.phone === phone)
      .sort((a, b) => (b.createdAt||'').localeCompare(a.createdAt||''))
      .map(b => {
        const slot  = slotsDB.all().find(s => s.id === (b.slotId||b.slot_id));
        const cls   = classroomsDB.get(b.classroomId||b.classroom_id);
        const isCancelled = b.status === 'cancelled';
        const rec   = recordsDB.byBooking(b.id);
        let statusLabel, statusCls;
        if (isCancelled) {
          statusLabel = '已取消'; statusCls = 'badge-gray';
        } else if (rec?.outcome) {
          const OMAP = {'1':'已出席已註冊','2':'已出席未註冊','3':'未出席','4':'取消重預約','5':'其他'};
          statusLabel = OMAP[rec.outcome]||'已記錄'; statusCls = 'badge-green';
        } else {
          statusLabel = '待診斷'; statusCls = 'badge-amber';
        }
        const cancellable = canCancel(b);
        return `<tr data-booking-id="${b.id}">
          <td class="fw-600 text-zh">${b.studentName||b.student_name||''}</td>
          <td>${b.subject||''}</td>
          <td>${slot ? fmtDate(slot.date) : '-'}</td>
          <td style="font-family:var(--font-body);font-weight:600">${slot?.time||'-'}</td>
          <td class="text-zh text-sm">${cls?.name||'-'}</td>
          <td><span class="badge ${statusCls}">${statusLabel}</span></td>
          <td>
            ${cancellable
              ? `<button class="btn btn-sm btn-danger btn-cancel-booking" data-bid="${b.id}"
                   data-student="${b.studentName||b.student_name||''}"
                   data-date="${slot?.date||''}" data-time="${slot?.time||''}"
                   data-cls="${cls?.name||''}">
                   取消預約
                 </button>`
              : `<span class="text-xs text-muted">—</span>`}
          </td>
        </tr>`;
      }).join('');
  }

  function renderTable() {
    result.innerHTML = `
      <div class="alert alert-info" style="margin-bottom:10px">
        ${icon('info','icon')}
        <span>如需取消，請於診斷時間前操作。已完成診斷紀錄的預約無法取消。</span>
      </div>
      <div class="table-wrap">
        <table class="table">
          <thead><tr><th>學生</th><th>科目</th><th>日期</th><th>時間</th><th>教室</th><th>狀態</th><th>操作</th></tr></thead>
          <tbody>${buildRows()}</tbody>
        </table>
      </div>

      <!-- 取消確認 Modal -->
      <div id="cancel-modal" class="modal-backdrop hidden">
        <div class="modal">
          <div class="modal-header">
            <div class="modal-title">確認取消預約</div>
            <button class="modal-close" id="cancel-modal-close">${icon('x','icon')}</button>
          </div>
          <div id="cancel-modal-body"></div>
          <div class="form-group" style="margin-top:14px">
            <label class="form-label">取消原因（選填）</label>
            <select id="cancel-reason" class="form-control">
              <option value="">請選擇原因</option>
              <option value="時間衝突">時間衝突，需改期</option>
              <option value="不需要了">不需要了</option>
              <option value="已改其他教室">已改約其他教室</option>
              <option value="其他">其他原因</option>
            </select>
          </div>
          <div id="cancel-reason-other-wrap" class="form-group hidden">
            <label class="form-label">請說明原因</label>
            <input id="cancel-reason-other" class="form-control" placeholder="請輸入原因">
          </div>
          <div class="modal-footer">
            <button class="btn" id="cancel-modal-no">返回</button>
            <button class="btn btn-danger" id="cancel-modal-yes">確認取消此預約</button>
          </div>
        </div>
      </div>`;

    let pendingCancelId = null;

    // Bind cancel buttons
    result.querySelectorAll('.btn-cancel-booking').forEach(btn => {
      btn.addEventListener('click', () => {
        pendingCancelId = btn.dataset.bid;
        const student   = btn.dataset.student;
        const date      = btn.dataset.date ? fmtDate(btn.dataset.date) : '';
        const time      = btn.dataset.time;
        const cls       = btn.dataset.cls;
        document.getElementById('cancel-modal-body').innerHTML = `
          <div style="background:var(--gray-50);border-radius:var(--radius-md);padding:14px 16px;font-family:var(--font-zh);font-size:.875rem;line-height:2;margin-bottom:4px">
            <div>👤 學生：<strong>${student}</strong></div>
            <div>📅 日期：<strong>${date} ${time}</strong></div>
            <div>🏫 教室：<strong>${cls}</strong></div>
          </div>
          <p class="text-zh" style="font-size:.875rem;color:var(--red-700);margin-top:10px">
            ⚠️ 取消後時段將釋出，若需重新預約請重新填寫表單。
          </p>`;
        document.getElementById('cancel-modal').classList.remove('hidden');
        document.getElementById('cancel-reason').value = '';
        document.getElementById('cancel-reason-other-wrap').classList.add('hidden');
      });
    });

    // Reason selector
    result.querySelector('#cancel-reason').addEventListener('change', function() {
      const wrap = document.getElementById('cancel-reason-other-wrap');
      wrap.classList.toggle('hidden', this.value !== '其他');
    });

    // Close modal
    result.querySelector('#cancel-modal-close').addEventListener('click', () => {
      document.getElementById('cancel-modal').classList.add('hidden');
    });
    result.querySelector('#cancel-modal-no').addEventListener('click', () => {
      document.getElementById('cancel-modal').classList.add('hidden');
    });

    // Confirm cancel
    result.querySelector('#cancel-modal-yes').addEventListener('click', async () => {
      if (!pendingCancelId) return;
      const reason = document.getElementById('cancel-reason').value;
      const otherReason = document.getElementById('cancel-reason-other')?.value?.trim() || '';
      const finalReason = reason === '其他' ? (otherReason || '其他') : (reason || '家長取消');

      const b = bookingsDB.all().find(bk => bk.id === pendingCancelId);

      // Update booking status only（家長取消不寫診斷紀錄）
      await bookingsDB.update(pendingCancelId, {
        status: 'cancelled',
        cancelReason: finalReason,
        cancelledAt: new Date().toISOString(),
        cancelledBy: 'parent',
      });

      document.getElementById('cancel-modal').classList.add('hidden');
      showToast('預約已取消，時段已釋出', 'success');

      // Re-render table
      renderTable();
    });
  }

  renderTable();
}

function bindSlotEvents(container, user) {
  renderSlotsTable(container, user);
  populateDateFilter(container, user);

  container.querySelector('#btn-add-slot').addEventListener('click', async () => {
    const date     = container.querySelector('#new-date').value;
    const time     = container.querySelector('#new-time').value;
    const capacity = 1;
    const errEl    = container.querySelector('#slot-add-error');

    if (!date) { errEl.textContent = '請選擇日期'; errEl.classList.remove('hidden'); return; }
    errEl.classList.add('hidden');

    // Duplicate check
    const existing = slotsDB.byClassroom(user.classroomId).find(s => s.date === date && s.time === time);
    if (existing) { errEl.textContent = '此日期時間已存在相同時段'; errEl.classList.remove('hidden'); return; }

    slotsDB.add({ id: uid('sl'), classroomId: user.classroomId, date, time, capacity, createdAt: new Date().toISOString() });
    renderSlotsTable(container, user);
    populateDateFilter(container, user);
    showToast('時段已新增', 'success');
  });

  container.querySelector('#filter-date').addEventListener('change', () => renderSlotsTable(container, user));
}

function renderSlotsTable(container, user) {
  const tbody      = container.querySelector('#slots-tbody');
  const filterDate = container.querySelector('#filter-date')?.value || '';
  let slots = slotsDB.byClassroom(user.classroomId)
    .filter(s => (!filterDate || s.date === filterDate))
    .sort((a, b) => a.date.localeCompare(b.date) || a.time.localeCompare(b.time));

  if (!slots.length) { tbody.innerHTML = `<tr><td colspan="7" class="table-empty">尚無時段，請新增</td></tr>`; return; }

  tbody.innerHTML = slots.map(s => {
    const booked = bookingsDB.bySlot(s.id).length;
    const remain = s.capacity - booked;
    const full   = remain <= 0;
    return `<tr>
      <td>${fmtDate(s.date)}</td>
      <td><span style="font-family:var(--font-body);font-weight:600">${s.time}</span></td>
      <td>${s.capacity}</td>
      <td>${booked}</td>
      <td><span class="badge ${full ? 'badge-red' : 'badge-green'}">${full ? '已額滿' : `剩 ${remain}`}</span></td>
      <td>
        <button class="btn btn-sm btn-danger" data-del="${s.id}" ${booked > 0 ? 'disabled title="已有預約，無法刪除"' : ''}>
          ${icon('trash','icon')} 刪除
        </button>
      </td>
    </tr>`;
  }).join('');

  tbody.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('確定要刪除此時段？')) return;
      await slotsDB.delete(btn.dataset.del);
      renderSlotsTable(container, user);
      populateDateFilter(container, user);
      showToast('時段已刪除');
    });
  });
}

function populateDateFilter(container, user) {
  const sel   = container.querySelector('#filter-date');
  if (!sel) return;
  const cur   = sel.value;
  const dates = [...new Set(slotsDB.byClassroom(user.classroomId).map(s => s.date))].sort();
  sel.innerHTML = `<option value="">全部日期</option>` + dates.map(d => `<option value="${d}" ${d === cur ? 'selected' : ''}>${fmtDate(d)}</option>`).join('');
}

function buildBookingsPage(user) {

function bindBookingsEvents(container, user) {
  populateBkDateFilter(container, user);
  renderBookingsTable(container, user);

  ['#bk-filter-date','#bk-filter-status'].forEach(sel => {
    container.querySelector(sel)?.addEventListener('change', () => renderBookingsTable(container, user));
  });

  const exportBtn = container.querySelector('#btn-export-my');
  if (exportBtn) exportBtn.addEventListener('click', () => exportMyClassroomReport(user));

  container.querySelector('#record-modal-close').addEventListener('click', () => {
    container.querySelector('#record-modal').classList.add('hidden');
  });
}

function renderBookingsTable(container, user) {
  const tbody  = container.querySelector('#bk-tbody');
  const fDate  = container.querySelector('#bk-filter-date')?.value || '';
  const fStatus= container.querySelector('#bk-filter-status')?.value || '';

  const slotIds = slotsDB.byClassroom(user.classroomId).map(s => s.id);
  let bookings  = bookingsDB.all()
    .filter(b => slotIds.includes(b.slotId || b.slot_id))
    .filter(b => {
      if (!fStatus) return true;
      if (fStatus === 'cancelled') return b.status === 'cancelled';
      const rec = recordsDB.byBooking(b.id);
      if (fStatus === 'unfilled') return b.status !== 'cancelled' && !rec?.outcome;
      if (fStatus === 'filled')   return !!rec?.outcome;
      return true;
    });

  if (fDate) {
    bookings = bookings.filter(b => {
      const slot = slotsDB.get(b.slotId);
      return (!fDate || slot?.date === fDate);
    });
  }

  bookings.sort((a, b) => {
    const sa = slotsDB.get(a.slotId), sb = slotsDB.get(b.slotId);
    return (sa?.date || '').localeCompare(sb?.date || '') || (sa?.time || '').localeCompare(sb?.time || '');
  });

  if (!bookings.length) { tbody.innerHTML = `<tr><td colspan="7" class="table-empty">查無符合的預約</td></tr>`; return; }

  const OUTCOME_MAP = {
    '1': ['已出席，已註冊', 'badge-green'],
    '2': ['已出席，未註冊', 'badge-blue'],
    '3': ['未出席',         'badge-red'],
    '4': ['取消重預約',     'badge-amber'],
    '5': ['其他',           'badge-gray'],
  };
  // 額外判斷是否為家長主動取消
  function getOutcomeDisplay(b, rec) {
    if (b.status === 'cancelled' && b.cancelledBy === 'parent') {
      return ['家長主動取消', 'badge-red'];
    }
    if (!rec?.outcome) return ['待填寫', 'badge-amber'];
    if (rec.outcome === '3' && rec.absentReason) {
      return [`未出席：${rec.absentReason}`, 'badge-red'];
    }
    return OUTCOME_MAP[rec.outcome] || ['已記錄', 'badge-gray'];
  }
  const colors = ['av-green','av-amber','av-blue'];

  tbody.innerHTML = bookings.map((b, i) => {
    const slot  = slotsDB.get(b.slotId);
    const grade = GRADES.find(g => g.id === b.gradeId);
    const rec   = recordsDB.byBooking(b.id);
    const [outcomeLabel, outcomeCls] = getOutcomeDisplay(b, rec);
    return `<tr>
      <td>
        <div class="flex items-center gap-8">
          <div class="avatar ${colors[i%3]}">${b.studentName.slice(-1)}</div>
          <div>
            <div class="fw-600 text-zh">${b.studentName}</div>
            <div class="text-xs text-muted">${b.parentName ? b.parentName + ' 家長 ｜ ' : ''}${b.phone}</div>
          </div>
        </div>
      </td>
      <td>${grade?.label || '-'}</td>
      <td>${slot ? fmtDate(slot.date) : '-'}</td>
      <td style="font-family:var(--font-body);font-weight:600">${slot?.time || '-'}</td>
      <td>
        ${b.status==='cancelled' && b.cancelReason
          ? `<span style="font-size:.8rem;color:var(--red-700);font-family:var(--font-zh)">原因：${b.cancelReason}</span>`
          : (b.note||b.note_text) ? `<span style="font-size:.8rem;color:var(--gray-700);font-family:var(--font-zh);max-width:140px;display:inline-block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${b.note||''}">${b.note||''}</span>` : '<span class="text-muted text-xs">—</span>'}
      </td>
      <td><span class="badge ${outcomeCls}">${outcomeLabel}</span></td>
      <td>
        ${b.status === 'cancelled' && b.cancelledBy === 'parent'
          ? '<span class="badge badge-red" style="font-size:.75rem">家長主動取消</span>'
          : `<button class="btn btn-sm btn-primary" data-open-record="${b.id}">
              ${icon('edit','icon')} ${rec?.outcome ? '修改' : '填寫'}紀錄
             </button>`}
      </td>
    </tr>`;
  }).join('');

  tbody.querySelectorAll('[data-open-record]').forEach(btn => {
    btn.addEventListener('click', () => openRecordModal(container, user, btn.dataset.openRecord));
  });
}

function openRecordModal(container, user, bookingId) {
  const b     = bookingsDB.get(bookingId);
  const slot  = slotsDB.all().find(s => s.id === (b?.slotId||b?.slot_id));
  const grade = GRADES.find(g => g.id === (b?.gradeId ?? b?.grade_id));
  const rec   = recordsDB.byBooking(bookingId) || {};
  const modal = container.querySelector('#record-modal');

  const OUTCOMES = [
    { value: '1', label: '已出席學診，已註冊',           icon: '✅', badge: 'badge-green' },
    { value: '2', label: '已出席學診，未註冊',           icon: '📋', badge: 'badge-blue'  },
    { value: '3', label: '未出席學診',                   icon: '❌', badge: 'badge-red'   },
    { value: '4', label: '此次預約取消，已請家長重新預約', icon: '🔄', badge: 'badge-amber' },
    { value: '5', label: '其他',                         icon: '📝', badge: 'badge-gray'  },
  ];

  // 未出席原因選項
  const ABSENT_REASONS = [
    '臨時有事，無法出席',
    '忘記預約時間',
    '孩子生病',
    '家長無法接送',
    '聯繫不上家長',
    '其他原因',
  ];

  const curOutcome      = rec.outcome      || '';
  const curAbsentReason = rec.absentReason || '';
  const curOtherNote    = rec.otherNote    || '';

  container.querySelector('#record-modal-title').textContent = `${b.studentName||b.student_name} 後續狀況記錄`;

  container.querySelector('#record-modal-body').innerHTML = `
    <div class="flex items-center gap-12 mb-16 p-12" style="background:var(--gray-50);border-radius:var(--radius-md)">
      <div class="text-zh" style="font-size:.875rem;line-height:2">
        <div><strong>學生：</strong>${b.studentName||b.student_name} ／ ${grade?.label||''} ／ ${b.subject||''}</div>
        <div><strong>家長：</strong>${b.parentName||b.parent_name||'—'}</div>
        <div><strong>電話：</strong>${b.phone||''}</div>
        <div><strong>時間：</strong>${slot ? fmtDate(slot.date)+' '+slot.time : '-'}</div>
        ${(b.note||b.note_text) ? `<div><strong>家長備註：</strong>${b.note||b.note_text}</div>` : ''}
        ${rec.outcome ? `<div><strong>已記錄：</strong>${OUTCOMES.find(o=>o.value===rec.outcome)?.label||''}${rec.absentReason?' ／ '+rec.absentReason:''}</div>` : ''}
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">後續狀況 <span class="req">*</span></label>
      <div id="outcome-options" style="display:flex;flex-direction:column;gap:8px;margin-top:6px">
        ${OUTCOMES.map(o => `
          <label style="display:flex;align-items:center;gap:12px;padding:12px 16px;border:1.5px solid var(--gray-100);border-radius:var(--radius-md);cursor:pointer;transition:.12s;background:var(--white)"
                 class="outcome-label ${curOutcome===o.value?'outcome-selected':''}" data-val="${o.value}">
            <input type="radio" name="outcome" value="${o.value}" ${curOutcome===o.value?'checked':''} style="width:16px;height:16px;accent-color:#7DCDF4;flex-shrink:0">
            <span style="font-size:1.1rem">${o.icon}</span>
            <span class="text-zh" style="font-size:.9rem;font-weight:${curOutcome===o.value?'600':'400'}">${o.label}</span>
          </label>`).join('')}
      </div>
    </div>

    <!-- 未出席原因（選項3時出現）-->
    <div id="absent-reason-wrap" class="form-group ${curOutcome==='3'?'':'hidden'}">
      <label class="form-label">未出席原因 <span class="req">*</span></label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px" id="absent-reason-grid">
        ${ABSENT_REASONS.map(r => `
          <label style="display:flex;align-items:center;gap:8px;padding:9px 12px;border:1.5px solid var(--gray-100);border-radius:var(--radius-md);cursor:pointer;font-family:var(--font-zh);font-size:.85rem;background:var(--white)"
                 class="absent-label ${curAbsentReason===r?'outcome-selected':''}">
            <input type="radio" name="absentReason" value="${r}" ${curAbsentReason===r?'checked':''}
                   style="width:14px;height:14px;accent-color:#7DCDF4;flex-shrink:0">
            ${r}
          </label>`).join('')}
      </div>
      <div class="form-group mt-8" id="absent-followup-wrap">
        <label class="form-label">後續處理方式</label>
        <select id="absent-followup" class="form-control">
          <option value="">請選擇</option>
          <option value="已聯繫，重新安排時間" ${rec.absentFollowup==='已聯繫，重新安排時間'?'selected':''}>已聯繫，重新安排時間</option>
          <option value="已聯繫，家長表示不需要" ${rec.absentFollowup==='已聯繫，家長表示不需要'?'selected':''}>已聯繫，家長表示不需要</option>
          <option value="多次聯繫未接通" ${rec.absentFollowup==='多次聯繫未接通'?'selected':''}>多次聯繫未接通</option>
          <option value="等待家長回覆" ${rec.absentFollowup==='等待家長回覆'?'selected':''}>等待家長回覆</option>
        </select>
      </div>
    </div>

    <!-- 其他說明（選項5時出現）-->
    <div id="other-note-wrap" class="form-group ${curOutcome==='5'?'':'hidden'}">
      <label class="form-label">其他說明 <span class="req">*</span></label>
      <textarea id="rec-other-note" class="form-control" rows="3" placeholder="請填寫詳細說明...">${curOtherNote}</textarea>
    </div>

    <div id="rec-save-error" class="form-error hidden"></div>
    <div class="modal-footer">
      <button class="btn" id="rec-cancel">取消</button>
      <button class="btn btn-primary" id="rec-save">${icon('check','icon')} 儲存紀錄</button>
    </div>`;

  // ── 樣式 ──────────────────────────────────────────────────────────────────
  let style = document.getElementById('outcome-style');
  if (!style) { style = document.createElement('style'); style.id='outcome-style'; document.head.appendChild(style); }
  style.textContent = `.outcome-selected { border-color:#7DCDF4 !important; background:#edf8fe !important; }`;

  // ── 選項互動 ──────────────────────────────────────────────────────────────
  container.querySelectorAll('.outcome-label').forEach(lbl => {
    lbl.addEventListener('click', () => {
      container.querySelectorAll('.outcome-label').forEach(l => l.classList.remove('outcome-selected'));
      lbl.classList.add('outcome-selected');
      const val = lbl.dataset.val;
      container.querySelector('#absent-reason-wrap').classList.toggle('hidden', val !== '3');
      container.querySelector('#other-note-wrap').classList.toggle('hidden', val !== '5');
      if (val === '5') container.querySelector('#rec-other-note').focus();
    });
  });

  // 未出席原因選中高亮
  container.querySelectorAll('.absent-label').forEach(lbl => {
    lbl.addEventListener('click', () => {
      container.querySelectorAll('.absent-label').forEach(l => l.classList.remove('outcome-selected'));
      lbl.classList.add('outcome-selected');
    });
  });

  container.querySelector('#rec-cancel').addEventListener('click', () => modal.classList.add('hidden'));

  container.querySelector('#rec-save').addEventListener('click', async () => {
    const errEl    = container.querySelector('#rec-save-error');
    const selected = container.querySelector('input[name="outcome"]:checked');
    if (!selected) {
      errEl.textContent = '請選擇一個後續狀況';
      errEl.classList.remove('hidden'); return;
    }
    const outcome = selected.value;

    // 驗證未出席原因
    let absentReason = '', absentFollowup = '';
    if (outcome === '3') {
      const ar = container.querySelector('input[name="absentReason"]:checked');
      if (!ar) {
        errEl.textContent = '請選擇未出席原因';
        errEl.classList.remove('hidden'); return;
      }
      absentReason  = ar.value;
      absentFollowup = container.querySelector('#absent-followup')?.value || '';
    }

    // 驗證其他說明
    const otherNote = container.querySelector('#rec-other-note')?.value.trim() || '';
    if (outcome === '5' && !otherNote) {
      errEl.textContent = '請填寫其他說明';
      errEl.classList.remove('hidden'); return;
    }
    errEl.classList.add('hidden');

    await recordsDB.upsert({
      bookingId,
      outcome,
      absentReason,
      absentFollowup,
      otherNote: outcome === '5' ? otherNote : '',
      savedAt:   new Date().toISOString(),
      teacherId: user.id,
    });

    const statusByOutcome = { '1':'done','2':'done','3':'done','4':'cancelled','5':'done' };
    await bookingsDB.update(bookingId, { status: statusByOutcome[outcome] });

    modal.classList.add('hidden');
    renderBookingsTable(container, user);
    const outcomeLabel = OUTCOMES.find(o => o.value === outcome)?.label;
    showToast(`已記錄：${outcomeLabel}`, 'success');
  });

  modal.classList.remove('hidden');
}

  const sel   = container.querySelector('#bk-filter-date');

  sel.innerHTML = `<option value="">全部日期</option>` + dates.map(d => `<option value="${d}">${fmtDate(d)}</option>`).join('');
}

function exportRegionReport(region, cls, allBookings, allRecords) {
  const label = region === '全國' ? '全國' : region;
  const now   = new Date().toLocaleDateString('zh-TW').replace(/\//g,'-');
  const OUTCOME_LABEL = {'1':'已出席，已註冊','2':'已出席，未註冊','3':'未出席','4':'取消重預約','5':'其他'};
  const GRADE_MAP = {};
  GRADES.forEach(g => { GRADE_MAP[g.id] = g.label; });

  // ── 工作表1：預約明細 ──────────────────────────────────────────────────
  const headers1 = ['教室名稱','營業所','家長姓名','學生姓名','學年','科目','預約日期','預約時間','聯絡電話','後續狀況','未出席原因','後續處理','其他說明','建立時間'];
  const rows1 = allBookings.map(b => {
    const slot = slotsDB.all().find(s => s.id === (b.slotId||b.slot_id));
    const c2   = classroomsDB.get(b.classroomId||b.classroom_id);
    const rec  = allRecords.find(r => (r.bookingId||r.booking_id) === b.id);
    return [
      c2?.name||'', c2?.region||'',
      b.parentName||b.parent_name||'',
      b.studentName||b.student_name||'',
      GRADE_MAP[b.gradeId??b.grade_id]||'',
      b.subject||'',
      slot?.date||'', slot?.time||'',
      b.phone||'',
      OUTCOME_LABEL[rec?.outcome]||'待填寫',
      rec?.absentReason||rec?.absent_reason||'',
      rec?.absentFollowup||rec?.absent_followup||'',
      rec?.otherNote||rec?.other_note||'',
      (b.createdAt||b.created_at||'').slice(0,10),
    ];
  });

  // ── 工作表2：教室統計摘要 ──────────────────────────────────────────────
  const headers2 = ['教室名稱','營業所','累計預約','已出席已註冊','已出席未註冊','未出席','取消重預約','其他','待填寫'];
  const rows2 = cls.map(c => {
    const bks  = allBookings.filter(b => (b.classroomId||b.classroom_id) === c.id);
    const recs = allRecords.filter(r => bks.find(b => b.id === (r.bookingId||r.booking_id)));
    const count = o => recs.filter(r => r.outcome === o).length;
    return [c.name, c.region||'', bks.length, count('1'), count('2'), count('3'), count('4'), count('5'), bks.length-recs.length];
  });

  // ── 用 SheetJS 建立真正的 xlsx ─────────────────────────────────────────
  try {
    const XLSX = window.XLSX;
    if (!XLSX) throw new Error('SheetJS not loaded');

    const wb = XLSX.utils.book_new();

    // Sheet 1: 預約明細
    const ws1data = [headers1, ...rows1];
    const ws1 = XLSX.utils.aoa_to_sheet(ws1data);
    // 設定欄寬
    ws1['!cols'] = [20,8,8,8,8,6,10,6,12,12,16,10].map(w => ({wch:w}));
    // 標題列樣式（粗體）
    XLSX.utils.book_append_sheet(wb, ws1, '預約明細');

    // Sheet 2: 教室統計
    const ws2data = [headers2, ...rows2];
    const ws2 = XLSX.utils.aoa_to_sheet(ws2data);
    ws2['!cols'] = [22,8,8,10,10,8,10,6,8].map(w => ({wch:w}));
    XLSX.utils.book_append_sheet(wb, ws2, '教室統計摘要');

    // 產出並下載
    XLSX.writeFile(wb, `KUMON學力診斷_${label}_${now}.xlsx`);
    showToast(`${label} Excel 報表已下載`, 'success');
  } catch(e) {
    // Fallback to CSV if SheetJS fails
    console.warn('SheetJS not available, falling back to CSV', e);
    const BOM = '\uFEFF';
    const esc = v => `"${String(v??'').replace(/"/g,'""')}"`;
    const toCSV = (h,r) => [h,,...r].map(row => Array.isArray(row)?row.map(esc).join(','):row).join('\r\n');
    const csv = BOM + toCSV(headers1, rows1) + '\r\n\r\n' + toCSV(headers2, rows2);
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const a = Object.assign(document.createElement('a'), {href:URL.createObjectURL(blob), download:`KUMON學力診斷_${label}_${now}.csv`});
    a.click();
    showToast(`${label} 報表已下載（CSV 格式）`, 'success');
  }
}

// 教室帳號下載自己教室的報表
async function exportMyClassroomReport(user) {
  const cls = classroomsDB.get(user.classroomId || user.classroom_id);
  if (!cls) { showToast('找不到教室資料', 'error'); return; }
  const allBookings = bookingsDB.byClassroom(cls.id);
  const allRecords  = recordsDB.byClassroom(cls.id);
  exportRegionReport(cls.name, [cls], allBookings, allRecords);
}

function showToast(msg, type = '') {
  let tc = document.querySelector('.toast-container');
  if (!tc) { tc = document.createElement('div'); tc.className = 'toast-container'; document.body.appendChild(tc); }
  const t = document.createElement('div');
  t.className = `toast${type ? ' toast-'+type : ''}`;
  t.textContent = msg;
  tc.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}



// ── 管理員：數據總覽 ───────────────────────────────────────────────────────
function renderAdminOverview(container) {
  const REGIONS = ['全國', '北北基', '桃竹苗', '中彰投', '雲嘉南', '雄東'];
  let activeRegion = '全國';
  let dateFrom = '';
  let dateTo   = '';

  // 快速區間選項
  function setQuickRange(type) {
    const now   = new Date();
    const today = now.toISOString().slice(0,10);
    const pad   = n => String(n).padStart(2,'0');
    if (type === 'this_month') {
      dateFrom = `${now.getFullYear()}-${pad(now.getMonth()+1)}-01`;
      dateTo   = today;
    } else if (type === 'last_month') {
      const lm = new Date(now.getFullYear(), now.getMonth()-1, 1);
      const lme = new Date(now.getFullYear(), now.getMonth(), 0);
      dateFrom = `${lm.getFullYear()}-${pad(lm.getMonth()+1)}-01`;
      dateTo   = `${lme.getFullYear()}-${pad(lme.getMonth()+1)}-${pad(lme.getDate())}`;
    } else if (type === 'last_3m') {
      const d = new Date(now); d.setMonth(d.getMonth()-3);
      dateFrom = d.toISOString().slice(0,10);
      dateTo   = today;
    } else if (type === 'this_year') {
      dateFrom = `${now.getFullYear()}-01-01`;
      dateTo   = today;
    } else {
      dateFrom = ''; dateTo = '';
    }
    const df = container.querySelector('#date-from');
    const dt = container.querySelector('#date-to');
    if (df) df.value = dateFrom;
    if (dt) dt.value = dateTo;
  }

  function getFilteredClassrooms(region) {
    const all = classroomsDB.all();
    return region === '全國' ? all : all.filter(c => c.region === region);
  }

  function filterByDate(bookings) {
    if (!dateFrom && !dateTo) return bookings;
    return bookings.filter(b => {
      const slot = slotsDB.all().find(s => s.id===(b.slotId||b.slot_id));
      if (!slot) return false;
      // 統一取前10字 yyyy-mm-dd，避免 ISO timestamp 格式差異
      const d = (slot.date||'').slice(0,10);
      if (!d) return false;
      if (dateFrom && d < dateFrom.slice(0,10)) return false;
      if (dateTo   && d > dateTo.slice(0,10))   return false;
      return true;
    });
  }

  function statsForClassroomFiltered(cid, filteredBookings) {
    const bookings = filteredBookings.filter(b => (b.classroomId||b.classroom_id)===cid);
    const records  = recordsDB.byClassroom(cid);
    const parentCanc = bookings.filter(b=>b.status==='cancelled'&&(b.cancelledBy||b.cancelled_by)==='parent').length;
    const teacherDone = bookings.filter(b => {
      if (b.status==='cancelled') return false; // 家長取消不算老師填寫
      return !!records.find(r=>(r.bookingId||r.booking_id)===b.id)?.outcome;
    }).length;
    const done = teacherDone; // bar chart 用老師填寫數
    const subjectMap = {};
    SUBJECTS.forEach(s => { subjectMap[s] = 0; });
    bookings.forEach(b => { if (b.subject) subjectMap[b.subject]=(subjectMap[b.subject]||0)+1; });
    return { total: bookings.length, done, parentCanc, subjectMap };
  }

  function renderStats(region) {
    const cls    = getFilteredClassrooms(region);
    const clsIds = cls.map(c => c.id);
    const allBookingsRaw = bookingsDB.all().filter(b => clsIds.includes(b.classroomId||b.classroom_id));
    const allBookings    = filterByDate(allBookingsRaw);
    const allRecords     = recordsDB.all().filter(r => {
      const b = allBookings.find(b2 => b2.id===(r.bookingId||r.booking_id));
      return !!b;
    });

    const total = allBookings.length;
    // 家長主動取消（不需老師填寫）
    const parentCancelled = allBookings.filter(b => b.status==='cancelled' && (b.cancelledBy||b.cancelled_by)==='parent').length;
    // 老師填寫的後續狀況（排除家長取消，因為那筆不應有 record）
    const teacherBookingIds = new Set(allBookings.filter(b=>b.status!=='cancelled').map(b=>b.id));
    const o1 = allRecords.filter(r=>r.outcome==='1'&&teacherBookingIds.has(r.bookingId||r.booking_id)).length;
    const o2 = allRecords.filter(r=>r.outcome==='2'&&teacherBookingIds.has(r.bookingId||r.booking_id)).length;
    const o3 = allRecords.filter(r=>r.outcome==='3'&&teacherBookingIds.has(r.bookingId||r.booking_id)).length;
    const o4 = allRecords.filter(r=>r.outcome==='4'&&teacherBookingIds.has(r.bookingId||r.booking_id)).length;
    const o5 = allRecords.filter(r=>r.outcome==='5'&&teacherBookingIds.has(r.bookingId||r.booking_id)).length;
    const teacherFilled = o1+o2+o3+o4+o5;
    const filled  = teacherFilled; // 已填寫 = 老師有填紀錄的
    const pending = total - parentCancelled - teacherFilled; // 待填寫 = 剩下需要老師處理的
    const rate    = (total-parentCancelled) ? Math.round(teacherFilled/(total-parentCancelled)*100) : 0;

    // 科目統計
    const subStats = {};
    SUBJECTS.forEach(s => subStats[s] = 0);
    allBookings.forEach(b => { if (b.subject) subStats[b.subject]=(subStats[b.subject]||0)+1; });

    const cStats = cls.map(c => ({ c, s: statsForClassroomFiltered(c.id, allBookings) }))
      .sort((a,b)=>b.s.total-a.s.total);
    const maxTotal = Math.max(...cStats.map(x=>x.s.total), 1);
    const teacherCount = accountsDB.all().filter(a => a.role==='teacher' && clsIds.includes(a.classroomId||a.classroom_id)).length;

    const regionLabel = region==='全國' ? `全國（${cls.length} 間）` : `${region}（${cls.length} 間）`;
    const dateLabel   = (dateFrom||dateTo)
      ? `${dateFrom||'—'} ～ ${dateTo||'今日'}`
      : '全部時間';

    // 後續狀況卡片
    const outcomeCards = [
      { label:'已出席已註冊', val:o1,             pct: total?Math.round(o1/total*100):0 },
      { label:'已出席未註冊', val:o2,             pct: total?Math.round(o2/total*100):0 },
      { label:'未出席',       val:o3,             pct: total?Math.round(o3/total*100):0 },
      { label:'取消重預約',   val:o4,             pct: total?Math.round(o4/total*100):0 },
      { label:'家長主動取消', val:parentCancelled,pct: total?Math.round(parentCancelled/total*100):0 },
      { label:'其他',         val:o5,             pct: total?Math.round(o5/total*100):0 },
      { label:'待填寫',       val:pending,        pct: total?Math.round(pending/total*100):0 },
    ];

    document.getElementById('overview-stats-area').innerHTML = `
      <!-- 總覽數字 -->
      <div class="stat-grid" style="margin-bottom:16px">
        <div class="stat-card">
          <div class="stat-label">${regionLabel}</div>
          <div class="stat-value">${total}</div>
          <div class="stat-sub">${dateLabel}</div>
        </div>
        <div class="stat-card"><div class="stat-label">已填寫紀錄</div><div class="stat-value green">${filled}</div></div>
        <div class="stat-card"><div class="stat-label">待填寫</div><div class="stat-value amber">${pending}</div></div>
        <div class="stat-card"><div class="stat-label">填寫率</div><div class="stat-value green">${rate}%</div></div>
        <div class="stat-card"><div class="stat-label">教師帳號</div><div class="stat-value">${teacherCount}</div></div>
      </div>

      <!-- 後續狀況分類統計 -->
      <div class="card" style="margin-bottom:16px">
        <div class="card-title">後續狀況分類</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px">
          ${outcomeCards.map(o => `
            <div style="background:var(--gray-50);border-radius:var(--radius-md);padding:12px 14px;text-align:center">
              <div style="font-size:1.4rem;font-weight:700;color:var(--${o.cls?'green-700':'gray-700'})" class="${o.cls?'text-'+o.cls:''}"
                   style="color:${o.cls==='green'?'#0f6e56':o.cls==='blue'?'#0c447c':o.cls==='red'?'#a32d2d':o.cls==='amber'?'#854f0b':'#444441'}">
                ${o.val}
              </div>
              <div style="font-size:.75rem;color:var(--gray-500);font-family:var(--font-zh);margin-top:2px">${o.label}</div>
              <div style="font-size:.7rem;color:var(--gray-400)">${o.pct}%</div>
            </div>`).join('')}
        </div>
      </div>

      <div class="grid-2">
        <div class="card">
          <div class="card-title">各教室預約量 ${cStats.length>15?'<span style="font-size:.75rem;font-weight:400;color:var(--gray-500)">（前15間）</span>':''}</div>
          <div class="bar-chart">
            ${cStats.slice(0,15).map(({c,s}) => `
              <div class="bar-col" title="${c.name}: ${s.total}件">
                <div class="bar-val">${s.total}</div>
                <div class="bar" style="height:${Math.max(s.total/maxTotal*100,4)}%"></div>
                <div class="bar-label">${c.name.replace('KUMON','').replace('教室','').slice(0,5)}</div>
              </div>`).join('')}
          </div>
        </div>
        <div class="card">
          <div class="card-title">科目診斷分佈</div>
          ${SUBJECTS.map(s => {
            const count = subStats[s]||0;
            const pct   = Math.round(count/(total||1)*100);
            return `<div class="mb-16">
              <div class="flex justify-between mb-8">
                <span class="text-zh fw-600" style="font-size:.875rem">${s}</span>
                <span class="text-muted" style="font-size:.8rem">${count} 件（${pct}%）</span>
              </div>
              <div class="progress"><div class="progress-fill" style="width:${pct}%"></div></div>
            </div>`;
          }).join('')}
        </div>
      </div>

      <div class="card">
        <div class="flex justify-between items-center" style="margin-bottom:14px">
          <div class="card-title" style="margin-bottom:0;border:none;padding:0">教室詳細數據</div>
          <button class="btn btn-sm btn-primary" id="btn-export-region">
            ${icon('document','icon')} 下載 Excel
          </button>
        </div>
        <div class="table-wrap">
          <table class="table">
            <thead><tr>
              <th>教室</th><th>營業所</th><th>預約數</th>
              <th>已出席已註冊</th><th>已出席未註冊</th><th>未出席</th>
              <th>取消</th><th>待填寫</th><th>填寫率</th>
            </tr></thead>
            <tbody>
              ${cStats.map(({c,s}) => {
                const bks  = allBookings.filter(b=>(b.classroomId||b.classroom_id)===c.id);
                const recs = allRecords.filter(r=>bks.find(b=>b.id===(r.bookingId||r.booking_id)));
                const cc = o => recs.filter(r=>r.outcome===o).length;
                const canc = bks.filter(b=>b.status==='cancelled'&&(b.cancelledBy||b.cancelled_by)==='parent').length;
                const pend = bks.length - (cc('1')+cc('2')+cc('3')+cc('4')+cc('5')+canc);
                const r2   = bks.length ? Math.round((bks.length-pend)/bks.length*100) : 0;
                return `<tr>
                  <td class="fw-600 text-zh">${c.name}</td>
                  <td><span class="badge badge-blue">${c.region||'—'}</span></td>
                  <td class="fw-600">${bks.length}</td>
                  <td>${cc('1')}</td><td>${cc('2')}</td><td>${cc('3')}</td>
                  <td>${canc}</td>
                  <td>${pend > 0 ? `<span class="badge badge-amber">${pend}</span>` : '0'}</td>
                  <td>
                    <div class="flex items-center gap-8">
                      <div class="progress" style="width:44px"><div class="progress-fill" style="width:${r2}%"></div></div>
                      <span style="font-size:.8rem">${r2}%</span>
                    </div>
                  </td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>`;

    document.getElementById('btn-export-region')?.addEventListener('click', () =>
      exportRegionReport(region, cls, allBookings, allRecords));
  }

  // ── 初始 HTML ─────────────────────────────────────────────────────────
  const today     = new Date().toISOString().slice(0,10);
  const monthStart= today.slice(0,7) + '-01';

  container.innerHTML = `
<div class="page-header">
  <div class="page-title">數據總覽</div>
  <div class="page-subtitle">依營業所與時間區間篩選統計</div>
</div>

<!-- 營業所 Tab -->
<div class="tab-bar" style="margin-bottom:16px">
  ${REGIONS.map(r => `<button class="tab ${r==='全國'?'active':''}" data-region="${r}">${r}</button>`).join('')}
</div>

<!-- 時間區間篩選 -->
<div class="card" style="padding:14px 20px;margin-bottom:16px">
  <div class="flex items-center gap-10" style="flex-wrap:wrap">
    <span class="fw-600 text-zh" style="font-size:.875rem;white-space:nowrap">時間區間</span>
    <div class="flex gap-6" style="flex-wrap:wrap">
      <button class="btn btn-sm" data-quick="all">全部</button>
      <button class="btn btn-sm active" data-quick="this_month" style="background:#1E1E1E;color:#fff;border-color:#1E1E1E">本月</button>
      <button class="btn btn-sm" data-quick="last_month">上月</button>
      <button class="btn btn-sm" data-quick="last_3m">近3個月</button>
      <button class="btn btn-sm" data-quick="this_year">今年</button>
    </div>
    <div class="flex items-center gap-6" style="flex-wrap:wrap">
      <input type="date" id="date-from" class="form-control" value="${monthStart}" style="width:145px;font-size:.825rem">
      <span class="text-muted">～</span>
      <input type="date" id="date-to"   class="form-control" value="${today}"      style="width:145px;font-size:.825rem">
      <button class="btn btn-sm btn-primary" id="btn-apply-date">套用</button>
    </div>
  </div>
</div>

<div id="overview-stats-area"></div>`;

  // 預設本月
  setQuickRange('this_month');

  // Tab 切換
  container.querySelectorAll('.tab[data-region]').forEach(tab => {
    tab.addEventListener('click', () => {
      container.querySelectorAll('.tab[data-region]').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      activeRegion = tab.dataset.region;
      renderStats(activeRegion);
    });
  });

  // 快速區間
  container.querySelectorAll('[data-quick]').forEach(btn => {
    btn.addEventListener('click', () => {
      container.querySelectorAll('[data-quick]').forEach(b => {
        b.style.background=''; b.style.color=''; b.style.borderColor='';
      });
      btn.style.background='#1E1E1E'; btn.style.color='#fff'; btn.style.borderColor='#1E1E1E';
      setQuickRange(btn.dataset.quick);
      renderStats(activeRegion);
    });
  });

  // 套用自訂區間
  container.querySelector('#btn-apply-date').addEventListener('click', () => {
    dateFrom = container.querySelector('#date-from').value;
    dateTo   = container.querySelector('#date-to').value;
    container.querySelectorAll('[data-quick]').forEach(b => {
      b.style.background=''; b.style.color=''; b.style.borderColor='';
    });
    renderStats(activeRegion);
  });

  renderStats('全國');
}

function bindClassroomEvents(container) {
  renderClassroomsTable(container, '', '', '');

  // 新增教室
  container.querySelector('#btn-add-cls').addEventListener('click', async () => {
    const id     = container.querySelector('#new-cls-id').value.trim();
    const name   = container.querySelector('#new-cls-name').value.trim();
    const addr   = container.querySelector('#new-cls-addr').value.trim();
    const phone  = container.querySelector('#new-cls-phone').value.trim();
    const region = container.querySelector('#new-cls-region').value;
    const err    = container.querySelector('#cls-add-error');

    if (!id || !name || !addr) { err.textContent='請填寫教室ID、名稱與地址'; err.classList.remove('hidden'); return; }
    if (classroomsDB.get(id)) { err.textContent='此教室ID已存在'; err.classList.remove('hidden'); return; }
    err.classList.add('hidden');

    const parsed = parseAddressCityDistrict(addr);
    const newCls = { id, name, address: addr, phone, region, city: parsed.city, district: parsed.district, active: true };
    try {
      await supaFetch('POST','classrooms',[newCls],{on_conflict:'id'});
      _cache.classrooms = [...(_cache.classrooms||[]), normalizeClassroom(newCls)];
      ['#new-cls-id','#new-cls-name','#new-cls-addr','#new-cls-phone'].forEach(s=>{ container.querySelector(s).value=''; });
      container.querySelector('#new-cls-region').value = '';
      renderClassroomsTable(container, '', '', '');
      showToast(`${name} 已新增`, 'success');
    } catch(e) {
      err.textContent = '新增失敗：' + e.message;
      err.classList.remove('hidden');
    }
  });

  // 搜尋
  container.querySelector('#btn-cls-search').addEventListener('click', () => {
    renderClassroomsTable(container,
      container.querySelector('#cls-search').value.trim(),
      container.querySelector('#cls-filter-region').value,
      container.querySelector('#cls-filter-active').value
    );
  });
  container.querySelector('#cls-search').addEventListener('keydown', e => {
    if (e.key === 'Enter') container.querySelector('#btn-cls-search').click();
  });
  container.querySelector('#btn-cls-reset').addEventListener('click', () => {
    container.querySelector('#cls-search').value = '';
    container.querySelector('#cls-filter-region').value = '';
    container.querySelector('#cls-filter-active').value = '';
    renderClassroomsTable(container, '', '', '');
  });
  container.querySelector('#cls-modal-close').addEventListener('click', () => {
    container.querySelector('#cls-modal').classList.add('hidden');
  });

  // 綁定「預約詳情」按鈕（delegated，因為表格是動態渲染的）
  container.querySelector('#cls-tbody').addEventListener('click', e => {
    const btn = e.target.closest('[data-view-cls]');

// ── 系統設定：存到 Supabase settings 表，localStorage 作為快取 ────────────
const SETTINGS_KEY = 'ld_system_settings_v2';
const SETTINGS_DEFAULTS = { bookingWindowDays: 60, minHoursAhead: 24, emailNotify: false };

function getSettings() {
  try {
    const raw = localStorage.getItem(SETTINGS_KEY);
    return raw ? { ...SETTINGS_DEFAULTS, ...JSON.parse(raw) } : { ...SETTINGS_DEFAULTS };
  } catch { return { ...SETTINGS_DEFAULTS }; }
}

async function saveSettings(settings) {
  // 存到 localStorage（即時生效）
  localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
  // 非同步同步到 Supabase settings 表
  try {
    await supaFetch('POST', 'system_settings',
      { id: 'global', settings_json: JSON.stringify(settings) },
      { on_conflict: 'id' }
    );
  } catch(e) {
    console.warn('Settings sync to Supabase failed:', e);
    // 不影響本地使用，下次載入時重試
  }
}

async function loadSettingsFromDB() {
  try {
    const rows = await supaFetch('GET', 'system_settings', null, { id: 'eq.global', limit: '1' });
    if (rows && rows.length > 0 && rows[0].settings_json) {
      const dbSettings = JSON.parse(rows[0].settings_json);
      localStorage.setItem(SETTINGS_KEY, JSON.stringify({ ...SETTINGS_DEFAULTS, ...dbSettings }));
    }
  } catch(e) {
    console.warn('Could not load settings from DB:', e);
  }
}

function openClsBookingDetail(container, classroomId, readOnly) {
  const cls      = classroomsDB.get(classroomId);
  if (!cls) return;
  const bookings = bookingsDB.byClassroom(classroomId)
    .sort((a, b) => {
      const sa = slotsDB.all().find(s=>s.id===(a.slotId||a.slot_id));
      const sb = slotsDB.all().find(s=>s.id===(b.slotId||b.slot_id));
      return (sb?.date||'').localeCompare(sa?.date||'') || (sb?.time||'').localeCompare(sa?.time||'');
    });
  const records  = recordsDB.byClassroom(classroomId);

  const OUTCOME_LABEL = {'1':'已出席已註冊','2':'已出席未註冊','3':'未出席','4':'取消重預約','5':'其他'};
  const GRADE_MAP = {};
  GRADES.forEach(g => { GRADE_MAP[g.id] = g.label; });

  // 找或建 modal
  let modal = document.getElementById('cls-detail-modal');
  if (!modal) {
    modal = document.createElement('div');
    modal.id = 'cls-detail-modal';
    modal.className = 'modal-backdrop hidden';
    modal.innerHTML = `<div class="modal" style="max-width:860px;width:95vw">
      <div class="modal-header">
        <div class="modal-title" id="cls-detail-title"></div>
        <button class="modal-close" id="cls-detail-close">${icon('x','icon')}</button>
      </div>
      <div id="cls-detail-body"></div>
    </div>`;
    document.body.appendChild(modal);
    document.getElementById('cls-detail-close').addEventListener('click', () => {
      modal.classList.add('hidden');
    });
  }

  document.getElementById('cls-detail-title').textContent = `${cls.name} 預約詳情`;

  // 統計
  const total    = bookings.length;
  const filled   = bookings.filter(b => {
    if (b.status === 'cancelled') return true;
    return !!records.find(r => (r.bookingId||r.booking_id) === b.id)?.outcome;
  }).length;
  const pending  = total - filled;

  const rows = bookings.length ? bookings.map(b => {
    const slot = slotsDB.all().find(s => s.id===(b.slotId||b.slot_id));
    const rec  = records.find(r => (r.bookingId||r.booking_id) === b.id);
    let statusLabel, statusCls;
    if (b.status === 'cancelled' && b.cancelledBy === 'parent') {
      statusLabel = '家長主動取消'; statusCls = 'badge-red';
    } else if (rec?.outcome) {
      statusLabel = OUTCOME_LABEL[rec.outcome]||'已記錄';
      statusCls = rec.outcome==='1'?'badge-green':rec.outcome==='2'?'badge-blue':rec.outcome==='3'?'badge-red':'badge-amber';
      if (rec.outcome==='3' && rec.absentReason) statusLabel += `：${rec.absentReason}`;
    } else {
      statusLabel = '待填寫'; statusCls = 'badge-amber';
    }
    return `<tr>
      <td class="text-zh fw-600">${b.studentName||b.student_name||''}</td>
      <td class="text-zh">${b.parentName||b.parent_name||''}</td>
      <td class="text-zh text-sm">${GRADE_MAP[b.gradeId??b.grade_id]||''}</td>
      <td class="text-zh">${b.subject||''}</td>
      <td>${slot ? fmtDate(slot.date) : '-'}</td>
      <td style="font-family:var(--font-body);font-weight:600">${slot?.time||'-'}</td>
      <td class="text-zh text-sm text-muted">${b.phone||''}</td>
      <td class="text-zh text-sm" style="color:var(--red-700)">${b.cancelReason||b.cancel_reason||''}</td>
      <td><span class="badge ${statusCls}" style="font-size:.7rem">${statusLabel}</span></td>
    </tr>`;
  }).join('') : `<tr><td colspan="9" class="table-empty">此教室尚無預約紀錄</td></tr>`;

  document.getElementById('cls-detail-body').innerHTML = `
    <div class="stat-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:16px">
      <div class="stat-card"><div class="stat-label">累計預約</div><div class="stat-value">${total}</div></div>
      <div class="stat-card"><div class="stat-label">已填寫紀錄</div><div class="stat-value green">${filled}</div></div>
      <div class="stat-card"><div class="stat-label">待填寫</div><div class="stat-value amber">${pending}</div></div>
    </div>
    <div class="flex justify-between items-center mb-16">
      <div style="font-size:.875rem;font-weight:600;font-family:var(--font-zh)">完整預約明細</div>
      <button class="btn btn-sm btn-primary" id="btn-export-cls-detail">
        ${icon('document','icon')} 匯出 Excel
      </button>
    </div>
    <div class="table-wrap">
      <table class="table" style="font-size:.8rem">
        <thead><tr>
          <th>學生</th><th>家長</th><th>學年</th><th>科目</th>
          <th>日期</th><th>時間</th><th>電話</th><th>取消原因</th><th>狀態</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;

  // 匯出按鈕
  document.getElementById('btn-export-cls-detail').addEventListener('click', () => {
    exportRegionReport(cls.name, [cls], bookings, records);
  });

  modal.classList.remove('hidden');
}

      <thead><tr><th>設定項目</th><th>目前值</th><th>效果說明</th></tr></thead>
      <tbody>
        <tr>
          <td class="fw-600 text-zh">預約時間窗口</td>
          <td><span class="badge badge-blue">${s.bookingWindowDays} 天</span></td>
          <td class="text-zh">家長最遠可預約 ${new Date(Date.now()+s.bookingWindowDays*86400000).toLocaleDateString('zh-TW')} 之前的時段</td>
        </tr>
        <tr>
          <td class="fw-600 text-zh">最短提前時間</td>
          <td><span class="badge badge-blue">${s.minHoursAhead} 小時</span></td>
          <td class="text-zh">距離診斷時間不足 ${s.minHoursAhead} 小時的時段，家長無法預約</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>`;

  // Live preview
  function updatePreview() {
    const days  = parseInt(container.querySelector('#setting-window').value) || 60;
    const hours = parseInt(container.querySelector('#setting-minhours').value) || 24;
    const today = new Date();
    const maxDate = new Date(today.getTime() + days * 86400000);
    const minDate = new Date(today.getTime() + hours * 3600000);
    container.querySelector('#settings-preview').innerHTML = `
      📅 家長今天可預約的時段範圍：<br>
      &nbsp;&nbsp;最早：<strong>${minDate.toLocaleDateString('zh-TW')} ${minDate.getHours().toString().padStart(2,'0')}:${minDate.getMinutes().toString().padStart(2,'0')} 以後</strong><br>
      &nbsp;&nbsp;最晚：<strong>${maxDate.toLocaleDateString('zh-TW')} 以前</strong>`;
  }

  container.querySelector('#setting-window').addEventListener('input', updatePreview);
  container.querySelector('#setting-minhours').addEventListener('input', updatePreview);
  updatePreview();

  container.querySelector('#btn-save-settings').addEventListener('click', async () => {
    const days  = parseInt(container.querySelector('#setting-window').value);
    const hours = parseInt(container.querySelector('#setting-minhours').value);
    const errEl = container.querySelector('#settings-error');

    if (!days || days < 1 || days > 365) {
      errEl.textContent = '預約窗口請設定 1–365 天';
      errEl.classList.remove('hidden'); return;
    }
    if (hours < 0 || hours > 168) {
      errEl.textContent = '最短提前時間請設定 0–168 小時';
      errEl.classList.remove('hidden'); return;
    }
    errEl.classList.add('hidden');
    const emailNotify = container.querySelector('#setting-email-notify')?.checked || false;
    await saveSettings({ bookingWindowDays: days, minHoursAhead: hours, emailNotify });
    showToast('設定已儲存', 'success');
    // Re-render to update table
    renderAdminSettings(container);
  });
}
